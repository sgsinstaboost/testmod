      const [showExitModal, setShowExitModal] = useState(false);

      const [toastMsg, setToastMsg] = useState('');

      // Initial history setup for back-button handling
      useEffect(() => {
        // Push initial home state to history stack so mobile back can be intercepted
        if (!window.history.state) {
          window.history.replaceState({ page: 'home' }, '');
        }

        const handlePopState = (e) => {
          // Priority 1: Close Exit Modal if open
          if (showExitModal) {
            setShowExitModal(false);
            window.history.pushState({ page: 'home' }, '');
            return;
          }

          // Priority 2: Close Active Service view
          if (activeService) {
            setActiveService(null);
            return;
          }

          // Priority 3: Close Policy/Contact Modals
          if (activeModalPage) {
            setActiveModalPage(null);
            return;
          }

          // Priority 4: Close Drawer
          if (showDrawer) {
            setShowDrawer(false);
            return;
          }

          // Priority 5: Reset Category Filter if not default
          if (selectedCat !== 'All Services') {
            setSelectedCat('All Services');
            return;
          }

          // Priority 6: User is at absolute Home screen -> Trigger Exit Confirmation Popup
          setShowExitModal(true);
          // Re-push state so user can decide in exit popup without leaving page immediately
          window.history.pushState({ page: 'home' }, '');
        };

        window.addEventListener('popstate', handlePopState);
        return () => window.removeEventListener('popstate', handlePopState);

        const newUid = generateUID();
        localStorage.setItem('sgs_user_name', trimmed);
        localStorage.setItem('sgs_user_uid', newUid);
        setUserName(trimmed);
        setUserUID(newUid);
        showNotification(`Welcome ${trimmed}! Your UID: ${newUid}`);

      const openWhatsAppChat = () => {
        try {
          const encNum = "OTExNzA4MDE2OQ=="; // Encrypted Base64 String
          const decNum = atob(encNum);
          const text = encodeURIComponent(`Hello SGS Online Service! I need support. My Name: ${userName || 'User'} (UID: ${userUID || 'N/A'})`);
          window.open(`https://wa.me/${decNum}?text=${text}`, '_blank', 'noopener,noreferrer');

          window.open("https://wa.me/9117080169", '_blank');
        }

        setToastMsg(msg);

                  </div>

                  {/* Right Status */}
                  <span className="text-[10px] text-emerald-400 font-bold bg-emerald-950/80 px-2.5 py-1 rounded-full border border-emerald-600/40">
                    Active
                  </span>
                </div>

                <div className="space-y-2">
                  {notices.map((n) => (
                    <div key={n.id} className="flex items-start justify-between gap-3 p-3 rounded-xl bg-slate-800/40 hover:bg-slate-800 transition-colors border border-slate-800">
                      <div className="flex items-start gap-2.5 text-xs sm:text-sm font-semibold text-slate-200">
                        <span className="text-amber-400 font-bold shrink-0 mt-0.5">🔹</span>
                        <span>{n.text}</span>
                      </div>
                      {n.date && <span className="text-[11px] text-amber-300/80 font-mono font-bold shrink-0">{n.date}</span>}
                    </div>
                  ))}
                </div>
              </div>

              {/* SEARCH & CATEGORY NAVIGATION TABS */}
              <div className="space-y-4 bg-slate-900/90 p-4 sm:p-5 rounded-3xl border border-slate-800 shadow-xl">
                <div className="relative">
                  <div className="absolute left-4 top-4 text-slate-400"><Icons.Search /></div>
                  <input
                    type="text"
                    value={searchQuery}
                    onChange={(e) => setSearchQuery(e.target.value)}
                    placeholder="College Admission, Jati, Scholarship Form search karein..."
                    className="w-full bg-slate-950/80 border-2 border-indigo-500/30 rounded-2xl pl-11 pr-4 py-3.5 text-xs sm:text-sm font-semibold text-white placeholder-slate-500 focus:outline-none focus:border-amber-400 shadow-inner transition-all"
                  />
                </div>

                {/* CATEGORY BUTTONS */}
                <div className="flex items-center gap-2.5 overflow-x-auto pb-1 scrollbar-none">
                  {categories.map((cat) => (
                    <button
                      key={cat}
                      onClick={() => setSelectedCat(cat)}
                      className={`px-4 py-2.5 rounded-xl text-xs sm:text-sm font-black transition-all border shrink-0 cursor-pointer ${
                        selectedCat === cat
                          ? 'bg-gradient-to-r from-amber-400 via-yellow-400 to-amber-500 text-slate-950 border-yellow-300 shadow-lg shadow-yellow-500/20 scale-105'
                          : 'bg-slate-800/80 text-slate-300 border-slate-700 hover:bg-slate-800 hover:text-white'
                      }`}
                    >
                      {cat}
                    </button>
                  ))}
                </div>
              </div>

              {/* SERVICE BUTTON CARDS GRID */}
              <div className="space-y-4">
                <div className="flex items-center justify-between">
                  <h3 className="font-black text-amber-300 text-sm sm:text-base tracking-wide flex items-center gap-2">
                    <span>⚡ Available Services</span>
                    <span className="bg-slate-800 text-slate-300 text-xs px-2.5 py-0.5 rounded-full border border-slate-700">
                      {filteredServices.length}
                    </span>
                  </h3>
                </div>

                {filteredServices.length === 0 ? (
                  <div className="bg-slate-900 p-10 rounded-3xl border border-slate-800 text-center">
                    <p className="text-slate-400 font-bold text-sm sm:text-base">Is category me abhi koi service nahi mili!</p>
                  </div>
                ) : (
                  <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                    {filteredServices.map((srv) => (
                      <div
                        key={srv.id}
                        onClick={() => openServiceDetail(srv)}
                        className="bg-slate-900 rounded-2xl border border-slate-800 hover:border-indigo-500/60 card-colorful-glow cursor-pointer flex flex-col justify-between group overflow-hidden"
                      >
                        <div className="p-5">
                          <div className="flex items-center justify-between mb-3">
                            <span className="bg-gradient-to-r from-indigo-950 to-purple-950 text-indigo-300 text-[10px] sm:text-[11px] font-black px-2.5 py-1 rounded-lg border border-indigo-700/50 uppercase tracking-wider">
                              {srv.category}
                            </span>
                          </div>

                          <h4 className="font-black text-white text-base group-hover:text-amber-300 transition-colors leading-snug">
                            {srv.title}
                          </h4>

                          {srv.shortDesc && (
                            <p className="text-xs text-slate-400 mt-2 line-clamp-2 font-medium">
                              {srv.shortDesc}
                            </p>
                          )}
                        </div>

                        <div className="p-4 pt-3 bg-slate-950/70 border-t border-slate-800 flex items-center justify-between text-xs font-black text-amber-400 group-hover:text-yellow-300">
                          <span>Full Detail & Apply</span>
                          <span className="group-hover:translate-x-1.5 transition-transform"><Icons.ChevronRight /></span>
                        </div>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            </main>
          )}

          {}
          {/* FLOATING WHATSAPP SUPPORT BUTTON */}
          <div className="fixed bottom-6 right-6 z-40">
            <button
              onClick={openWhatsAppChat}
              className="bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-400 hover:to-teal-500 text-white w-14 h-14 rounded-full shadow-2xl shadow-emerald-500/40 flex items-center justify-center transition-all duration-300 transform hover:scale-110 active:scale-95 border-2 border-white/80 cursor-pointer"
              title="Chat with Us on WhatsApp"
              aria-label="WhatsApp Support"
            >
              <Icons.WhatsApp />
            </button>
          </div>

          {/* FOOTER */}
          <footer className="bg-slate-950 text-slate-400 text-xs py-8 mt-12 border-t border-slate-800">
            <div className="max-w-6xl mx-auto px-4 flex flex-col sm:flex-row items-center justify-between gap-4 text-center sm:text-left">
              <div>
                <p className="font-black text-white text-sm">SGS ONLINE SERVICE © 2026</p>
                <p className="text-slate-500 text-[11px] mt-0.5">All Governmental & College Online Works Portal</p>
              </div>

              <div className="flex flex-wrap items-center justify-center gap-4 text-xs font-bold">
                <button
                  onClick={() => {
                    window.history.pushState({ modal: 'contact' }, '');
                    setActiveModalPage('contact');
                  }}
                  className="text-amber-300 hover:text-white underline underline-offset-4"
                >
                  Contact Us
                </button>

                <button
                  onClick={() => {
                    window.history.pushState({ modal: 'privacy' }, '');
                    setActiveModalPage('privacy');
                  }}
                  className="text-slate-400 hover:text-white underline underline-offset-4"
                >
                  Privacy Policy
                </button>

                <button
                  onClick={() => {
                    window.history.pushState({ modal: 'terms' }, '');
                    setActiveModalPage('terms');
                  }}
                  className="text-slate-400 hover:text-white underline underline-offset-4"
                >
                  Terms & Conditions
                </button>
              </div>
            </div>
          </footer>

        </div>
      );
    }

    // Render React Application Root
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
