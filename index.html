    // HIGH QUALITY HD IMAGE COMPRESSION
    const compressImage = (file) => {
      return new Promise((resolve) => {
        if (!file || file.type === 'application/pdf' || !file.type.startsWith('image/')) {
          resolve(file);
          return;
        }
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (event) => {
          const img = new Image();
          img.src = event.target.result;
          img.onload = () => {
            const canvas = document.createElement('canvas');
            const maxWidth = 1600;
            const scaleSize = maxWidth / img.width;
            
            if (scaleSize < 1) {
              canvas.width = maxWidth;
              canvas.height = img.height * scaleSize;
            } else {
              canvas.width = img.width;
              canvas.height = img.height;
            }

            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            
            canvas.toBlob((blob) => {
              if (blob) {
                const compressedFile = new File([blob], file.name, {
                  type: 'image/jpeg',
                  lastModified: Date.now()
                });
                resolve(compressedFile);
              } else {
                resolve(file);
              }
            }, 'image/jpeg', 0.85);
          };
        };
      });
    };

              <div className="relative w-80 max-w-[85%] bg-gray-900 border-r border-gray-800 h-full shadow-2xl flex flex-col justify-between z-10 p-6 overflow-y-auto">
                <div>
                  <div className="flex items-center justify-between pb-5 border-b border-gray-800 mb-5">
                    <h3 className="font-black text-transparent bg-clip-text bg-gradient-to-r from-amber-300 to-indigo-400 text-lg">
                      SGS ONLINE SERVICE
                    </h3>
                    <button onClick={() => setShowDrawer(false)} className="text-gray-400 hover:text-white"><Icons.X /></button>
                  </div>

                  {/* NAV LINKS */}
                  <nav className="space-y-2 text-xs font-bold text-gray-300">
                    <button onClick={() => { setSelectedCat('All Services'); setActiveService(null); setShowDrawer(false); }} className="w-full text-left p-3 rounded-xl hover:bg-gray-800/80 flex items-center justify-between text-indigo-400 transition-colors">
                      <span>🏠 Home Page / All Services</span>
                      <Icons.ChevronRight />
                    </button>

                    <button 
                      onClick={() => { window.history.pushState({ page: 'modal' }, ''); setActiveModalPage('track'); setShowDrawer(false); }} 
                      className="w-full text-left p-3 rounded-xl bg-amber-500/10 border border-amber-500/20 text-amber-300 flex items-center justify-between transition-colors"
                    >
                      <span className="flex items-center gap-2 font-extrabold">
                        <Icons.ListCheck /> Track My Application ({userApps.length})
                      </span>
                      <Icons.ChevronRight />
                    </button>

                    <button onClick={handleShareWebsite} className="w-full text-left p-3 rounded-xl bg-emerald-500/10 border border-emerald-500/20 text-emerald-300 flex items-center justify-between transition-colors">
                      <span className="flex items-center gap-2 font-extrabold"><Icons.Share2 /> Share Website</span>
                      <Icons.ChevronRight />
                    </button>
                    
                    <button onClick={() => { window.history.pushState({ page: 'modal' }, ''); setActiveModalPage('privacy'); setShowDrawer(false); }} className="w-full text-left p-3 rounded-xl hover:bg-gray-800 flex items-center justify-between">
                      <span>🔒 Privacy Policy</span>
                      <Icons.ChevronRight />
                    </button>
                    <button onClick={() => { window.history.pushState({ page: 'modal' }, ''); setActiveModalPage('terms'); setShowDrawer(false); }} className="w-full text-left p-3 rounded-xl hover:bg-gray-800 flex items-center justify-between">
                      <span>📜 Terms & Conditions</span>
                      <Icons.ChevronRight />
                    </button>
                    <button onClick={() => { window.history.pushState({ page: 'modal' }, ''); setActiveModalPage('disclaimer'); setShowDrawer(false); }} className="w-full text-left p-3 rounded-xl hover:bg-gray-800 flex items-center justify-between">
                      <span>⚠️ Disclaimer Notice</span>
                      <Icons.ChevronRight />
                    </button>
                  </nav>

                  {/* CUSTOMER SUPPORT */}
                  <div className="mt-8 pt-6 border-t border-gray-800 space-y-4">
                    <h4 className="text-[10px] font-black uppercase text-gray-500 tracking-wider flex items-center gap-2">
                      <Icons.Headphones /> Customer Support
                    </h4>
                    
                    <div className="glass-card rounded-2xl p-4 border border-gray-800">
                      <h5 className="font-extrabold text-white text-xs mb-1">WhatsApp Support</h5>
                      <p className="text-[11px] text-gray-400 mb-3 leading-snug">Instant Assistance on WhatsApp.</p>
                      <button onClick={handleWhatsAppSupport} className="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs py-2.5 rounded-xl transition-all shadow-lg shadow-emerald-900/30">
                        Chat on WhatsApp
                      </button>
                    </div>

                    <div className="glass-card rounded-2xl p-4 border border-gray-800">
                      <h5 className="font-extrabold text-white text-xs mb-1">Email Support</h5>
                      <p className="text-[11px] text-gray-400 mb-3 leading-snug">Official Ticket Assistance via Email.</p>
                      <button onClick={handleEmailSupport} className="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-xs py-2.5 rounded-xl transition-all shadow-lg shadow-indigo-900/30">
                        Send Email
                      </button>
                    </div>
                  </div>
                </div>

                <div className="pt-6 border-t border-gray-800 text-center text-[10px] text-gray-500 font-semibold">
                  SGS Helpdesk • Private Form Facilitation Center
                </div>
              </div>
            </div>
          )}

          {/* FULL SCREEN MODAL VIEW */}
          {activeModalPage ? (
            <div className="fixed inset-0 bg-gray-950 z-[140] flex flex-col h-full w-full overflow-hidden">
              <div className="bg-gray-900/80 backdrop-blur-md border-b border-gray-800 text-white px-5 py-4 flex items-center justify-between shrink-0">
                <h3 className="font-black text-white text-base sm:text-lg flex items-center gap-2">
                  <Icons.ShieldCheck />
                  <span>
                    {activeModalPage === 'track' && 'Track My Applications'}
                    {activeModalPage === 'privacy' && 'Privacy Policy'}
                    {activeModalPage === 'terms' && 'Terms & Conditions'}
                    {activeModalPage === 'disclaimer' && 'Disclaimer & Service Policy'}
                  </span>
                </h3>
                <button onClick={() => setActiveModalPage(null)} className="bg-gray-800 hover:bg-gray-700 text-white px-3.5 py-1.5 rounded-xl font-bold text-xs flex items-center gap-1.5 border border-gray-700">
                  <Icons.X /> Close
                </button>
              </div>

              <div className="flex-1 overflow-y-auto p-5 sm:p-8 max-w-4xl w-full mx-auto text-xs text-gray-300 space-y-5">
                
                {/* TRACK APPLICATION MODAL PAGE */}
                {activeModalPage === 'track' && (
                  <div className="space-y-4">
                    <div className="glass-card border-amber-500/20 p-4 rounded-2xl text-amber-200 font-medium flex items-center justify-between gap-3 flex-wrap">
                      <div>
                        <strong>📋 Application Tracking Center:</strong> Submitted requests tracking list.
                      </div>
                      {userApps.length > 0 && (
                        <button 
                          onClick={clearAllApps}
                          className="bg-rose-600 hover:bg-rose-500 text-white text-[11px] font-bold px-3 py-1.5 rounded-xl flex items-center gap-1 shadow-lg shadow-rose-950/40"
                        >
                          <Icons.Trash /> Clear All
                        </button>
                      )}
                    </div>

                    {userApps.length === 0 ? (
                      <div className="glass-card p-12 rounded-3xl text-center border-dashed border-gray-800">
                        <p className="text-sm font-bold text-gray-500">Aapne abhi tak koi form request submit nahi kiya hai.</p>
                      </div>
                    ) : (
                      <div className="space-y-3">
                        {userApps.map((app, i) => (
                          <div key={i} className="glass-card p-4 rounded-2xl border border-gray-800 flex items-center justify-between gap-3">
                            <div>
                              <span className="font-black text-indigo-400 text-sm block">UID: {app.uid}</span>
                              <p className="text-xs font-bold text-gray-200 mt-1">Form: {app.serviceTitle}</p>
                            </div>
                            <button 
                              onClick={() => deleteSingleApp(app.uid)}
                              title="Delete this record"
                              className="text-gray-500 hover:text-rose-400 p-2 rounded-xl hover:bg-rose-500/10 transition-colors"
                            >
                              <Icons.Trash />
                            </button>
                          </div>
                        ))}
                      </div>
                    )}
                  </div>
                )}

                {/* PRIVACY POLICY */}
                {activeModalPage === 'privacy' && (
                  <div className="glass-card p-6 rounded-3xl border border-gray-800 space-y-4 leading-relaxed">
                    <div className="bg-indigo-500/10 border-l-4 border-indigo-500 p-4 rounded-r-xl text-indigo-200 font-medium">
                      <strong>📌 Private Form Facilitation Center Privacy Policy:</strong> SGS ONLINE SERVICE operates independently as a private online digital assistance center.
                    </div>
                    <div className="space-y-2">
                      <h4 className="font-extrabold text-white text-sm">1. Comprehensive Data Collection Notice</h4>
                      <p>We collect personal data directly submitted by users during form submission:</p>
                      <ul className="list-disc pl-5 space-y-1 text-gray-400 font-medium">
                        <li><strong>Personal Identification:</strong> Full Name, Father's Name, Mother's Name, Date of Birth, Gender, Category/Caste, and Religion.</li>
                        <li><strong>Contact Details:</strong> Mobile Number, Email Address, Full Postal Address, District, Pin Code, and State.</li>
                        <li><strong>Academic & Identity:</strong> Educational Qualification details, Roll Numbers, Registration Numbers, Marksheets, and Certificates.</li>
                        <li><strong>Uploaded Documents:</strong> Applicant Photograph, Digital Signature Scans, PDF Documents, and Identity Proof files.</li>
                        <li><strong>Payment Proofs:</strong> Payment Screenshots, Fee Receipts, and Date of Payment.</li>
                      </ul>
                    </div>
                  </div>
                )}

                {/* TERMS & CONDITIONS */}
                {activeModalPage === 'terms' && (
                  <div className="glass-card p-6 rounded-3xl border border-gray-800 space-y-4 leading-relaxed">
                    <h4 className="font-extrabold text-white text-sm">1. Private Facilitation Service Overview</h4>
                    <p className="text-gray-400">SGS ONLINE SERVICE operates independently as a private cyber cafe and online form-filling assistance center.</p>
                  </div>
                )}

                {/* DISCLAIMER */}
                {activeModalPage === 'disclaimer' && (
                  <div className="glass-card p-6 rounded-3xl border border-gray-800 space-y-4 leading-relaxed">
                    <div className="bg-amber-500/10 border-l-4 border-amber-500 p-4 rounded-r-xl text-amber-200 font-bold">
                      ⚠️ DISCLAIMER & NON-AFFILIATION NOTICE
                    </div>
                    <p className="text-gray-400">SGS ONLINE SERVICE ek swatantra private online cyber cafe aur form filling assistance desk hai.</p>
                  </div>
                )}
              </div>

              <div className="p-4 bg-gray-900/80 border-t border-gray-800 flex justify-end shrink-0">
                <button onClick={() => setActiveModalPage(null)} className="bg-white text-gray-950 hover:bg-gray-200 font-extrabold px-6 py-2.5 rounded-xl text-xs transition-all shadow-lg">
                  Close Window
                </button>
              </div>
            </div>
          ) : (
            <>
              {/* STICKY HEADER */}
              <header className="sticky top-0 z-40 bg-gray-900/80 backdrop-blur-xl border-b border-gray-800 py-3 px-4 shadow-xl">
                <div className="max-w-6xl mx-auto flex items-center justify-between gap-3">
                  <button onClick={() => setShowDrawer(true)} className="p-2 text-gray-300 hover:text-white hover:bg-gray-800 rounded-xl transition-colors">
                    <Icons.Menu />
                  </button>
                  <div onClick={() => { setSelectedCat('All Services'); setActiveService(null); }} className="cursor-pointer text-center flex-1">
                    <h1 className="text-lg sm:text-2xl font-black bg-clip-text text-transparent bg-gradient-to-r from-amber-300 via-indigo-300 to-violet-400 tracking-tight">
                      SGS ONLINE SERVICE
                    </h1>
                    <p className="text-[9px] sm:text-[10px] font-extrabold text-indigo-400 tracking-wider uppercase">
                      Online Form Filling Assistance Portal
                    </p>
                  </div>
                </div>
              </header>

              {/* LEGAL NOTICE BANNER */}
              <div className="bg-gray-900/50 text-gray-400 text-[11px] px-4 py-2.5 border-b border-gray-800/80 text-center font-medium backdrop-blur-sm">
                <span className="bg-amber-400/10 text-amber-300 border border-amber-400/20 font-black px-2 py-0.5 rounded-md text-[10px] mr-2">NOTICE</span>
                SGS Online Service is an independent private form filling assistance portal (Cyber Cafe).
              </div>

              {/* MAIN CONTENT */}
              {activeService ? (
                <main className="flex-1 max-w-2xl w-full mx-auto px-4 py-8">
                  <button onClick={() => setActiveService(null)} className="inline-flex items-center gap-2 bg-gray-900 text-gray-300 font-bold text-xs px-4 py-2.5 rounded-xl border border-gray-800 mb-6 hover:bg-gray-800 transition-colors">
                    <Icons.ArrowLeft /> Back to Services
                  </button>

                  <div className="glass-card rounded-3xl border border-gray-800 overflow-hidden p-6 sm:p-8 shadow-2xl">
                    <span className="bg-indigo-500/10 text-indigo-300 border border-indigo-500/20 text-[10px] font-black px-3 py-1 rounded-full uppercase tracking-wider">{activeService.category}</span>
                    <h2 className="text-2xl sm:text-3xl font-black text-white mt-3 mb-2">{activeService.title}</h2>
                    <p className="text-xs text-gray-400 mb-6 leading-relaxed">{activeService.description}</p>

                    <div className="bg-amber-500/10 border border-amber-500/20 rounded-2xl p-4 text-[11px] text-amber-200 font-medium mb-6">
                      ℹ️ <strong>Assistance Notice:</strong> Information submitted below will be used to fill out your form on your behalf.
                    </div>

                    <form onSubmit={handleFormSubmit} className="space-y-5">
                      {activeService.fields && activeService.fields.map((field, idx) => (
                        <div key={idx} className="space-y-1.5">
                          <label className="block text-xs font-bold text-gray-300">{field.label}:</label>
                          {field.type === 'file' ? (
                            <div>
                              <input 
                                type="file" 
                                name={field.name} 
                                accept={field.accept || "image/*, application/pdf"} 
                                required={field.required}
                                onChange={(e) => handleFilePreview(e, `prev_img_${field.name}_${idx}`, `prev_pdf_${field.name}_${idx}`)}
                                className="w-full bg-gray-950 border border-gray-800 rounded-xl p-3 text-xs text-gray-400 file:mr-4 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-extrabold file:bg-indigo-600 file:text-white hover:file:bg-indigo-500" 
                              />
                              <img id={`prev_img_${field.name}_${idx}`} className="img-preview" alt="Selected Preview" />
                              <div id={`prev_pdf_${field.name}_${idx}`} className="pdf-preview"></div>
                            </div>
                          ) : field.type === 'radio' ? (
                            <div className="space-y-2.5 bg-gray-950 p-4 rounded-xl border border-gray-800">
                              {field.options && field.options.map((opt) => (
                                <label key={opt.id || opt.value} className="flex items-center gap-3 text-xs font-semibold text-gray-300 cursor-pointer">
                                  <input
                                    type="radio"
                                    name={field.name}
                                    value={opt.value}
                                    required={field.required}
                                    className="w-4 h-4 text-indigo-600 focus:ring-indigo-500 bg-gray-900 border-gray-700"
                                  />
                                  <span>{opt.label}</span>
                                </label>
                              ))}
                            </div>
                          ) : (
                            <input 
                              type={field.type} 
                              name={field.name} 
                              required={field.required} 
                              placeholder={field.placeholder || "Details fill karein"}
                              className="w-full bg-gray-950 border border-gray-800 rounded-xl p-3 text-xs text-white font-medium focus:outline-none focus:border-indigo-500 transition-colors" 
                            />
                          )}
                        </div>
                      ))}

                      {/* PAYMENT SECTION */}
                      {(() => {
                        const upi = getUpiDetails(activeService.qrImageUrl);
                        const amParam = upi.am ? `&am=${upi.am}` : "";
                        const phonepeUrl = `phonepe://pay?pa=${upi.pa}&pn=${encodeURIComponent(upi.pn)}${amParam}&cu=INR`;
                        const gpayUrl = `tez://upi/pay?pa=${upi.pa}&pn=${encodeURIComponent(upi.pn)}${amParam}&cu=INR`;
                        const genericUpiUrl = `upi://pay?pa=${upi.pa}&pn=${encodeURIComponent(upi.pn)}${amParam}&cu=INR`;

                        return (
                          <div className="glass-card border-indigo-500/30 p-5 rounded-2xl text-center my-6 space-y-4">
                            <p className="text-xs font-black text-indigo-300 uppercase tracking-wider">Scan QR or Click Below to Pay {upi.am ? `₹${upi.am}` : ''}</p>
                            
                            <div className="p-3 bg-white rounded-2xl inline-block shadow-2xl">
                              <img src={activeService.qrImageUrl} alt="Payment QR Code" className="max-w-[170px] mx-auto rounded-xl" />
                            </div>

                            <div className="pt-2 flex flex-col sm:flex-row gap-2.5 justify-center items-center">
                              <a 
                                href={phonepeUrl} 
                                className="w-full sm:w-auto flex-1 inline-flex items-center justify-center gap-2 bg-[#5f259f] hover:bg-[#4a1c7d] text-white font-bold text-xs py-3 px-4 rounded-xl shadow-lg transition-all"
                              >
                                <span>PhonePe</span>
                              </a>

                              <a 
                                href={gpayUrl} 
                                className="w-full sm:w-auto flex-1 inline-flex items-center justify-center gap-2 bg-white text-gray-900 hover:bg-gray-100 font-bold text-xs py-3 px-4 rounded-xl shadow-lg transition-all"
                              >
                                <span>Google Pay</span>
                              </a>

                              <a 
                                href={genericUpiUrl} 
                                className="w-full sm:w-auto flex-1 inline-flex items-center justify-center gap-2 bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs py-3 px-4 rounded-xl shadow-lg transition-all"
                              >
                                <span>Other Apps</span>
                              </a>
                            </div>
                          </div>
                        );
                      })()}

                      {/* PAYMENT SCREENSHOT UPLOAD */}
                      <div className="space-y-1.5">
                        <label className="block text-xs font-black text-rose-400 uppercase tracking-wider">Upload Payment Screenshot (Mandatory):</label>
                        <input 
                          type="file" 
                          name="main_payment_screenshot" 
                          accept="image/*" 
                          required 
                          onChange={(e) => handleFilePreview(e, 'prev_img_main_payment', 'prev_pdf_main_payment')}
                          className="w-full bg-gray-950 border border-rose-500/30 rounded-xl p-3 text-xs text-gray-400 file:mr-4 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-extrabold file:bg-rose-600 file:text-white" 
                        />
                        <img id="prev_img_main_payment" className="img-preview" alt="Payment Screenshot Preview" />
                        <div id="prev_pdf_main_payment" className="pdf-preview"></div>
                      </div>

                      <button 
                        type="submit" 
                        disabled={isSubmitting}
                        className="w-full bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500 text-white font-extrabold text-sm py-4 rounded-2xl shadow-xl transition-all active:scale-95 disabled:bg-gray-800 mt-4 border border-indigo-400/30"
                      >
                        {isSubmitting ? "Uploading & Submitting..." : "Submit Application →"}
                      </button>
                    </form>
                  </div>
                </main>
              ) : (
                <main className="flex-1 max-w-6xl w-full mx-auto px-4 py-8 space-y-8">
                  {/* NOTICE BOARD */}
                  <div className="glass-card rounded-3xl p-5 border border-indigo-500/20 shadow-xl relative overflow-hidden">
                    <div className="flex items-center justify-between border-b border-gray-800 pb-3 mb-4">
                      <div className="flex items-center gap-2.5">
                        <span className="text-indigo-400 animate-bounce"><Icons.Bell /></span>
                        <h2 className="font-black text-white text-xs uppercase tracking-widest">Notice Board</h2>
                      </div>
                      
                      <span className="inline-flex items-center gap-1.5 bg-rose-500/20 border border-rose-500/30 text-rose-300 font-black text-[10px] px-3 py-1 rounded-full tracking-widest">
                        <span className="w-2 h-2 rounded-full bg-rose-400 animate-ping"></span>
                        LIVE
                      </span>
                    </div>

                    <div className="space-y-3">
                      {notices.map((n) => (
                        <div key={n.id} className="flex items-start gap-3 text-xs font-semibold text-gray-300 bg-gray-950/50 p-3 rounded-2xl border border-gray-800">
                          <span className="text-indigo-400 font-black text-sm">•</span>
                          <span className="leading-relaxed">{n.text}</span>
                        </div>
                      ))}
                    </div>
                  </div>

                  {/* SEARCH & FILTERS */}
                  <div className="space-y-4">
                    <div className="relative">
                      <div className="absolute left-4 top-3.5 text-gray-500"><Icons.Search /></div>
                      <input
                        type="text"
                        value={searchQuery}
                        onChange={(e) => setSearchQuery(e.target.value)}
                        placeholder="Search form, service..."
                        className="w-full bg-gray-900 border border-gray-800 rounded-2xl pl-11 pr-4 py-3 text-xs sm:text-sm font-medium text-white focus:outline-none focus:border-indigo-500 transition-colors shadow-inner"
                      />
                    </div>

                    <div className="flex items-center gap-2.5 overflow-x-auto pb-2 scrollbar-none">
                      {categories.map((catObj) => {
                        const catName = typeof catObj === 'object' ? catObj.name : catObj;
                        const isSelected = selectedCat === catName;
                        return (
                          <button
                            key={catName}
                            onClick={() => {
                              if (catName !== selectedCat) {
                                window.history.pushState({ page: 'category' }, '');
                                setSelectedCat(catName);
                              }
                            }}
                            style={getCategoryButtonStyle(catObj, isSelected)}
                            className="px-4 py-2 rounded-xl text-xs font-extrabold transition-all border shrink-0"
                          >
                            {catName}
                          </button>
                        );
                      })}
                    </div>
                  </div>

                  {/* SERVICES GRID */}
                  <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
                    {filteredServices.map((srv) => (
                      <div
                        key={srv.id}
                        onClick={() => openServiceDetail(srv)}
                        className="glass-card glass-card-hover rounded-3xl p-5 shadow-xl cursor-pointer flex flex-col justify-between"
                      >
                        <div>
                          <span className="bg-gray-800 text-gray-400 border border-gray-700 text-[10px] font-black px-2.5 py-1 rounded-lg uppercase tracking-wider">
                            {srv.category}
                          </span>
                          <h4 className="font-extrabold text-white text-base mt-3">{srv.title}</h4>
                          <p className="text-xs text-gray-400 mt-2 line-clamp-2 leading-relaxed">{srv.description}</p>
                        </div>

                        <div className="pt-5 border-t border-gray-800 flex items-center justify-between text-xs font-extrabold text-indigo-400 mt-4">
                          <span>Apply Now & Fill Details</span>
                          <Icons.ChevronRight />
                        </div>
                      </div>
                    ))}
                  </div>
                </main>
              )}

              {/* FOOTER */}
              <footer className="bg-gray-950 text-gray-500 text-xs py-8 mt-16 border-t border-gray-800 text-center px-4">
                <p className="font-black text-gray-300">SGS ONLINE SERVICE © 2026</p>
                <div className="flex flex-wrap items-center justify-center gap-6 text-xs mt-4 font-semibold">
                  <button onClick={() => { window.history.pushState({ page: 'modal' }, ''); setActiveModalPage('privacy'); }} className="text-gray-400 hover:text-white transition-colors">Privacy Policy</button>
                  <button onClick={() => { window.history.pushState({ page: 'modal' }, ''); setActiveModalPage('terms'); }} className="text-gray-400 hover:text-white transition-colors">Terms & Conditions</button>
                  <button onClick={() => { window.history.pushState({ page: 'modal' }, ''); setActiveModalPage('disclaimer'); }} className="text-gray-400 hover:text-white transition-colors">Disclaimer</button>
                </div>
              </footer>
            </>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
