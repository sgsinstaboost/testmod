    // HIGH QUALITY HD IMAGE COMPRESSION
    const compressImage = (file) => {
      return new Promise((resolve) => {
        if (!file || file.type === 'application/pdf' || !file.type.startsWith('image/')) {
          resolve(file);
          return;
        }
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (event) => {
          const img = new Image();
          img.src = event.target.result;
          img.onload = () => {
            const canvas = document.createElement('canvas');
            canvas.width = img.width;
            canvas.height = img.height;

            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            
            canvas.toBlob((blob) => {
              if (blob) {
                const compressedFile = new File([blob], file.name, {
                  type: 'image/jpeg',
                  lastModified: Date.now()
                });
                resolve(compressedFile);
              } else {
                resolve(file);
              }
            }, 'image/jpeg', 0.92);
          };
        };
      });
    };

    // Helper to parse UPI params from QR code URL
    const getUpiDetails = (qrUrl) => {

      try {
        if (qrUrl) {
          const parsedUrl = new URL(qrUrl);
          const textParam = parsedUrl.searchParams.get("text");
          if (textParam) {
            const upiString = decodeURIComponent(textParam);
            const upiUrl = new URL(upiString);
            upiData.pa = upiUrl.searchParams.get("pa") || upiData.pa;
            upiData.pn = upiUrl.searchParams.get("pn") || upiData.pn;
            upiData.am = upiUrl.searchParams.get("am") || "";
          }
        }
      } catch (e) {
        console.error("UPI parse error", e);
      }
      return upiData;
    };

                                      onInput={(e) => {
                                        e.target.value = e.target.value.replace(/[^0-9]/g, '').slice(0, 10);
                                      }}
                                      className="w-full bg-slate-50 border border-slate-300 rounded-r-lg p-2.5 text-xs font-bold tracking-wide text-slate-900 focus:outline-none focus:border-orange-500" 
                                    />
                                  </div>
                                ) : (
                                  <input 
                                    type={field.type} 
                                    name={field.name} 
                                    required={field.required} 
                                    placeholder={field.placeholder || "Details fill karein"}
                                    className="w-full bg-slate-50 border border-slate-300 rounded-lg p-2.5 text-xs font-medium focus:outline-none focus:border-orange-500" 
                                  />
                                )}
                              </div>
                            );
                          })}

                          {/* CASHFREE ONLINE PAYMENT & MANUAL UPI SECTION */}
                          {activeService.qrImageUrl && (() => {
                            const upi = getUpiDetails(activeService.qrImageUrl);
                            const amParam = upi.am ? `&am=${upi.am}` : "";
                            const phonepeUrl = `phonepe://pay?pa=${upi.pa}&pn=${encodeURIComponent(upi.pn)}${amParam}&cu=INR`;
                            const gpayUrl = `tez://upi/pay?pa=${upi.pa}&pn=${encodeURIComponent(upi.pn)}${amParam}&cu=INR`;
                            const genericUpiUrl = `upi://pay?pa=${upi.pa}&pn=${encodeURIComponent(upi.pn)}${amParam}&cu=INR`;

                            return (
                              <div className="bg-orange-50/80 border border-orange-200 p-4 rounded-xl text-center my-4 space-y-3">
                                
                                {/* INSTANT ONLINE PAYMENT VIA CASHFREE GATEWAY */}
                                <div className="p-3 bg-white rounded-xl border-2 border-emerald-500 shadow-sm space-y-2">
                                  <div className="flex items-center justify-center gap-1.5 text-emerald-800 font-extrabold text-xs">
                                    <Icons.CreditCard />
                                    <span>Instant Online Payment Gateway (Fastest)</span>
                                  </div>
                                  <button
                                    type="button"
                                    onClick={handleCashfreeOnlinePayment}
                                    disabled={isCashfreeLoading}
                                    className="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-extrabold text-xs sm:text-sm py-3 px-4 rounded-xl shadow-md transition-all active:scale-95 flex items-center justify-center gap-2"
                                  >
                                    <span>{isCashfreeLoading ? "Connecting Payment Gateway..." : `⚡ Pay ₹${upi.am || '50'} via Cashfree (Cards / UPI / NetBanking)`}</span>
                                  </button>
                                  <p className="text-[10px] text-slate-500 font-medium">Automatic instant receipt generation after successful payment.</p>
                                </div>

                                <div className="flex items-center my-2">
                                  <div className="flex-1 border-t border-slate-300"></div>
                                  <span className="px-3 text-[11px] font-bold text-slate-500 uppercase">OR Scan QR Code</span>
                                  <div className="flex-1 border-t border-slate-300"></div>
                                </div>

                                <p className="text-xs font-extrabold text-orange-950">Scan QR or Click Below to Pay {upi.am ? `₹${upi.am}` : ''}</p>
                                
                                <img src={activeService.qrImageUrl} alt="Payment QR Code" className="max-w-[180px] mx-auto rounded-lg border-2 border-orange-500 shadow-sm" />

                                {/* DYNAMIC UPI BUTTONS */}
                                <div className="pt-2 flex flex-col sm:flex-row gap-2 justify-center items-center">
                                  {/* PhonePe Button */}
                                  <a 
                                    href={phonepeUrl} 
                                    className="w-full sm:w-auto flex-1 inline-flex items-center justify-center gap-2 bg-[#5f259f] hover:bg-[#4a1c7d] text-white font-bold text-xs py-2.5 px-3 rounded-lg shadow transition-all"
                                  >
                                    <svg className="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M18.8 10.2c0-2.4-1.9-4.3-4.3-4.3H8.3c-.6 0-1.1.5-1.1 1.1v10.1c0 .6.5 1.1 1.1 1.1h2.3c.6 0 1.1-.5 1.1-1.1v-2.8h2.8c2.4 0 4.3-1.9 4.3-4.2zm-4.3 1.9h-2.8v-3.8h2.8c1 0 1.9.9 1.9 1.9 0 1-.9 1.9-1.9 1.9z"/></svg>
                                    <span>PhonePe</span>
                                  </a>

                                  {/* GPay Button */}
                                  <a 
                                    href={gpayUrl} 
                                    className="w-full sm:w-auto flex-1 inline-flex items-center justify-center gap-2 bg-white text-slate-800 border border-slate-300 hover:bg-slate-50 font-bold text-xs py-2.5 px-3 rounded-lg shadow-sm transition-all"
                                  >
                                    <svg className="w-4 h-4" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
                                    <span>Google Pay</span>
                                  </a>

                                  {/* Pay via Other Apps Button */}
                                  <a 
                                    href={genericUpiUrl} 
                                    className="w-full sm:w-auto flex-1 inline-flex items-center justify-center gap-2 bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs py-2.5 px-3 rounded-lg shadow transition-all"
                                  >
                                    <svg className="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 14h-2v-2h2v2zm0-4h-2V7h2v5z"/></svg>
                                    <span>Pay via Other App</span>
                                  </a>
                                </div>
                              </div>
                            );
                          })()}

                          {/* PAYMENT SCREENSHOT UPLOAD */}
                          <div className="space-y-1">
                            <label className="block text-xs font-extrabold text-rose-600">Upload Payment Screenshot (Required for QR/Manual UPI):</label>
                            <input 
                              type="file" 
                              name="main_payment_screenshot" 
                              accept="image/*" 
                              onChange={(e) => handleFilePreview(e, 'prev_img_main_payment', 'prev_pdf_main_payment')}
                              className="w-full bg-slate-50 border border-rose-300 rounded-lg p-2.5 text-xs font-bold text-slate-900 focus:outline-none focus:border-rose-600" 
                            />
                            <img id="prev_img_main_payment" className="img-preview" alt="Payment Screenshot Preview" />
                            <div id="prev_pdf_main_payment" className="pdf-preview"></div>
                          </div>

                          <button 
                            type="submit" 
                            disabled={isSubmitting}
                            className="w-full tiranga-btn-primary font-extrabold text-sm py-3.5 rounded-xl shadow-lg transition-all active:scale-95 disabled:bg-slate-400 mt-2"
                          >
                            {isSubmitting ? "Uploading & Submitting..." : "Submit Application with Screenshot Proof →"}
                          </button>
                        </form>
                      </>
                    )}
                  </div>
                </main>
              ) : (
                <main className="flex-1 max-w-6xl w-full mx-auto px-4 py-6 space-y-6">
                  {/* COLORFUL TIRANGA NOTICE BOARD WITH BLINKING LIVE BUTTON */}
                  <div className="notice-board-box bg-gradient-to-r from-orange-50 via-white to-emerald-50 border-2 border-orange-300 rounded-2xl p-4 shadow-sm relative overflow-hidden">
                    <div className="flex items-center justify-between border-b border-orange-200 pb-2.5 mb-3">
                      <div className="flex items-center gap-2">
                        <span className="text-orange-600 animate-bounce"><Icons.Bell /></span>
                        <h2 className="font-black text-orange-950 text-sm uppercase tracking-wider">Notice Board</h2>
                      </div>
                      
                      {/* BLINKING LIVE BUTTON */}
                      <span className="inline-flex items-center gap-1.5 bg-gradient-to-r from-orange-600 to-emerald-600 text-white font-extrabold text-[10px] px-2.5 py-0.5 rounded-full shadow-md tracking-wider">
                        <span className="w-2 h-2 rounded-full bg-white animate-ping"></span>
                        LIVE
                      </span>
                    </div>

                    <div className="space-y-2.5">
                      {notices.map((n) => (
                        <div key={n.id} className="flex items-start gap-2.5 text-xs font-semibold text-slate-800 bg-white/90 p-2.5 rounded-xl border border-orange-200/80 shadow-2xs">
                          <span className="text-orange-600 font-extrabold text-sm leading-none">•</span>
                          <span className="leading-relaxed">{n.text}</span>
                        </div>
                      ))}
                    </div>
                  </div>

                  <div className="space-y-3">
                    <div className="relative">
                      <div className="absolute left-3.5 top-3 text-slate-400"><Icons.Search /></div>
                      <input
                        type="text"
                        value={searchQuery}
                        onChange={(e) => setSearchQuery(e.target.value)}
                        placeholder="Search form, service..."
                        className="w-full bg-white border border-slate-300 rounded-xl pl-10 pr-4 py-2.5 text-xs sm:text-sm font-medium focus:outline-none focus:border-orange-500"
                      />
                    </div>

                    <div className="flex items-center gap-2 overflow-x-auto pb-1 scrollbar-none">
                      {categories.map((catObj) => {
                        const catName = typeof catObj === 'object' ? catObj.name : catObj;
                        const isSelected = selectedCat === catName;
                        return (
                          <button
                            key={catName}
                            onClick={() => handleCategorySelect(catName)}
                            style={getCategoryButtonStyle(catObj, isSelected)}
                            className="px-3.5 py-1.5 rounded-lg text-xs font-bold transition-all border shrink-0"
                          >
                            {catName}
                          </button>
                        );
                      })}
                    </div>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                    {filteredServices.map((srv) => (
                      <div
                        key={srv.id}
                        onClick={() => openServiceDetail(srv)}
                        className="bg-white rounded-xl border border-slate-200 p-4 shadow-2xs hover:shadow-md hover:border-orange-400 transition-all cursor-pointer flex flex-col justify-between relative overflow-hidden group"
                      >
                        <div className="absolute top-0 left-0 right-0 h-1 bg-gradient-to-r from-orange-500 via-amber-300 to-emerald-500 opacity-80 group-hover:opacity-100 transition-opacity"></div>
                        <div>
                          <span className="post-category-badge bg-orange-100 text-orange-900 text-[10px] font-bold px-2 py-0.5 rounded border border-orange-200">
                            {srv.category}
                          </span>
                          <h4 className="font-bold text-slate-900 text-sm mt-2">{srv.title}</h4>
                          <p className="text-xs text-slate-500 mt-1 line-clamp-2">{srv.description}</p>
                        </div>

                        <div className="pt-4 border-t border-slate-100 flex items-center justify-between text-xs font-bold text-orange-600 mt-3 group-hover:text-emerald-700">
                          <span>Apply Now & Fill Details</span>
                          <Icons.ChevronRight />
                        </div>
                      </div>
                    ))}
                  </div>
                </main>
              )}

              {/* FOOTER WITH COMPLETE COMPLIANCE MODAL BUTTONS, TIMELINE & ADDRESS */}
              <footer className="bg-slate-950 text-slate-400 text-xs py-6 mt-12 border-t-4 border-orange-500 text-center px-4 relative">
                <p className="font-extrabold text-white">SGS ONLINE SERVICE © 2026 • Private Online Assistance Desk</p>
                <p className="text-[11px] text-slate-500 mt-1">📍 Registered Office: District Arrah, Bhojpur, Bihar, India - 802301 | Support: contactsgsonlineservice@gmail.com</p>
                <div className="flex flex-wrap items-center justify-center gap-4 text-xs mt-3">
                  <button onClick={() => { setActiveModalPage('about'); }} className="text-slate-400 hover:text-orange-400 underline">About Us</button>
                  <button onClick={() => { setActiveModalPage('support'); }} className="text-slate-400 hover:text-emerald-400 underline">Customer Support & Grievance</button>
                  <button onClick={() => { setActiveModalPage('delivery_policy'); }} className="text-slate-400 hover:text-orange-400 underline">Fulfillment Timeline</button>
                  <button onClick={() => { setActiveModalPage('privacy'); }} className="text-slate-400 hover:text-orange-400 underline">Privacy Policy</button>
                  <button onClick={() => { setActiveModalPage('payment_policy'); }} className="text-slate-400 hover:text-emerald-400 underline">Payment & Refund Policy</button>
                  <button onClick={() => { setActiveModalPage('terms'); }} className="text-slate-400 hover:text-emerald-400 underline">Terms & Conditions</button>
                  <button onClick={() => { setActiveModalPage('disclaimer'); }} className="text-slate-400 hover:text-orange-400 underline">Disclaimer</button>
                </div>
              </footer>
            </>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);

  </script>
</body>
</html>
