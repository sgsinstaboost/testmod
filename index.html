                          <li><strong>Residential & Address Details:</strong> Village/Town, Gram Panchayat / Ward No., Block, Sub-Division, District, State, and Pincode.</li>
                          <li><strong>Government Identification Documents:</strong> Identification proofs, Passport Size Photographs, Caste/Income/Residence Proofs.</li>
                          <li><strong>Educational & Academic Credentials:</strong> 10th & 12th Marksheets, Roll Numbers, Registration Cards, Admit Cards, and School/College Details.</li>

                          <span className="group-hover:translate-x-1 transition-transform"><Icons.ChevronRight /></span>
                        </div>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            </main>

          {/* FLOATING WHATSAPP SUPPORT BUTTON (ONLY ROUND LOGO ICON) */}

          </div>

          {/* FOOTER */}
          <footer className="bg-slate-900 text-slate-400 text-xs py-6 mt-12 border-t border-slate-800">

              <div className="flex items-center gap-4 text-xs">
                <button

                <button
                  onClick={() => setActiveModalPage('privacy')}

                <button
                  onClick={() => setActiveModalPage('terms')}

                  Terms & Conditions
                </button>

        </div>

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
