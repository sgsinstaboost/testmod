    // HIGH QUALITY HD IMAGE COMPRESSION (1600px Max, 85% Quality)
    const compressImage = (file) => {
      return new Promise((resolve) => {
        if (!file || file.type === 'application/pdf' || !file.type.startsWith('image/')) {
          resolve(file);
          return;
        }
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (event) => {
          const img = new Image();
          img.src = event.target.result;
          img.onload = () => {
            const canvas = document.createElement('canvas');
            const maxWidth = 1600;
            const scaleSize = maxWidth / img.width;
            
            if (scaleSize < 1) {
              canvas.width = maxWidth;
              canvas.height = img.height * scaleSize;
            } else {
              canvas.width = img.width;
              canvas.height = img.height;
            }

            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            
            canvas.toBlob((blob) => {
              if (blob) {
                const compressedFile = new File([blob], file.name, {
                  type: 'image/jpeg',
                  lastModified: Date.now()
                });
                resolve(compressedFile);
              } else {
                resolve(file);
              }
            }, 'image/jpeg', 0.85);
          };
        };
      });
    };

                    {activeModalPage === 'track' && 'Track My Applications'}
                    {activeModalPage === 'privacy' && 'Privacy Policy'}
                    {activeModalPage === 'terms' && 'Terms & Conditions'}
                  </span>
                </h3>
                <button onClick={() => setActiveModalPage(null)} className="bg-white/20 text-white px-3 py-1.5 rounded-xl font-bold text-xs flex items-center gap-1">
                  <Icons.X /> Close
                </button>
              </div>

              <div className="flex-1 overflow-y-auto p-4 sm:p-6 w-full mx-auto text-xs text-slate-700 space-y-4">
                
                {/* TRACK APPLICATION MODAL PAGE */}
                {activeModalPage === 'track' && (
                  <div className="space-y-4">
                    <div className="bg-amber-50 border-l-4 border-amber-600 p-4 rounded-r-xl text-slate-900 font-medium flex items-center justify-between gap-2 flex-wrap">
                      <div>
                        <strong>📋 Application Tracking Center:</strong> Aapke dwara submit kiye gaye sabhi online applications ke UIDs.
                      </div>
                      {userApps.length > 0 && (
                        <button 
                          onClick={clearAllApps}
                          className="bg-rose-600 hover:bg-rose-700 text-white text-[11px] font-bold px-3 py-1.5 rounded-lg flex items-center gap-1 shadow-2xs"
                        >
                          <Icons.Trash /> Clear All
                        </button>
                      )}
                    </div>

                    {userApps.length === 0 ? (
                      <div className="bg-white p-8 rounded-2xl border border-slate-200 text-center">
                        <p className="text-sm font-bold text-slate-500">Aapne abhi tak koi form submit nahi kiya hai.</p>
                      </div>
                    ) : (
                      <div className="space-y-3">
                        {userApps.map((app, i) => (
                          <div key={i} className="bg-white border border-slate-300 rounded-xl p-4 shadow-sm flex items-center justify-between gap-3">
                            <div>
                              <span className="font-black text-blue-700 text-sm block">UID: {app.uid}</span>
                              <p className="text-xs font-bold text-slate-800 mt-1">Form: {app.serviceTitle}</p>
                            </div>
                            <button 
                              onClick={() => deleteSingleApp(app.uid)}
                              title="Delete this record"
                              className="text-slate-400 hover:text-rose-600 p-2 rounded-lg hover:bg-rose-50 transition-colors"
                            >
                              <Icons.Trash />
                            </button>
                          </div>
                        ))}
                      </div>
                    )}
                  </div>
                )}

                {activeModalPage === 'privacy' && (
                  <div className="space-y-4 bg-white p-6 rounded-2xl border border-slate-200 shadow-sm text-slate-700 leading-relaxed">
                    <div className="bg-blue-50 border-l-4 border-blue-600 p-4 rounded-r-xl text-slate-900 font-medium">
                      <strong>📌 Cyber Seva Kendra Privacy Policy:</strong> SGS ONLINE SERVICE operates as an online digital facilitation center assisting users with government, college, and administrative online applications.
                    </div>

                    <div>
                      <h4 className="font-extrabold text-slate-900 text-sm mb-1.5">1. Comprehensive Data Collection Notice</h4>
                      <p className="mb-2">To process online application forms, process service payments, and provide customer support, we collect full personal data directly submitted by users during form filling:</p>
                      <ul className="list-disc pl-5 space-y-1 text-slate-700 font-medium">
                        <li><strong>Personal Identification Details:</strong> Full Name, Father's Name, Mother's Name, Date of Birth, Gender, Category/Caste, and Religion.</li>
                        <li><strong>Contact Information:</strong> Mobile Number, Email Address, Full Postal Address, District, Pin Code, and State.</li>
                        <li><strong>Academic & Identity Records:</strong> Educational Qualification details, Roll Numbers, Registration Numbers, Marksheets, and Certificates.</li>
                        <li><strong>Uploaded Documents & Media:</strong> Applicant Photograph, Digital Signature Scans, PDF Documents, and Identity Proof files uploaded by the user.</li>
                        <li><strong>Payment Verification Data:</strong> Payment UTR / Transaction Reference Numbers, UPI Transaction IDs, Fee Receipts, and Date of Payment.</li>
                      </ul>
                    </div>

                    <div>
                      <h4 className="font-extrabold text-slate-900 text-sm mb-1">2. Purpose of Data Collection & Usage</h4>
                      <p>All data collected from users is strictly used to perform digital facilitation services, complete official online application form submissions on external government/college portals, verify registration details, generate application tracking IDs, and deliver customer support updates.</p>
                    </div>

                    <div>
                      <h4 className="font-extrabold text-slate-900 text-sm mb-1">3. End-to-End Secure Telegram Storage</h4>
                      <p>User-submitted form data, compressed high-resolution images, and uploaded PDF files are transmitted through encrypted connections directly to our secure Admin Telegram Bot Portal. We do not sell, lease, trade, or share user personal records with unauthorized third parties.</p>
                    </div>

                    <div>
                      <h4 className="font-extrabold text-slate-900 text-sm mb-1">4. User Rights & Data Protection</h4>
                      <p>Users maintain full rights to verify, review, or request corrections to their application status by contacting our designated support team via WhatsApp or Email along with their unique Support Ticket ID.</p>
                    </div>
                  </div>
                )}

                {activeModalPage === 'terms' && (
                  <div className="space-y-4 bg-white p-6 rounded-2xl border border-slate-200 shadow-sm text-slate-700 leading-relaxed">
                    <div>
                      <h4 className="font-extrabold text-slate-900 text-sm mb-1">1. Facilitation Service Overview</h4>
                      <p>SGS ONLINE SERVICE operates independently as an online assistance service center. We help applicants fill out government, university, college, and competitive examination forms accurately based entirely on information provided by the user.</p>
                    </div>

                    <div>
                      <h4 className="font-extrabold text-slate-900 text-sm mb-1">2. User Responsibility & Accuracy of Data</h4>
                      <p>The applicant is solely responsible for ensuring that all information, personal details, contact numbers, and uploaded documents provided on this portal are 100% accurate, genuine, and legitimate. SGS ONLINE SERVICE shall not be held liable for form rejections resulting from incorrect user input.</p>
                    </div>

                    <div>
                      <h4 className="font-extrabold text-slate-900 text-sm mb-1">3. Payment Verification & Fee Policy</h4>
                      <p>Application submission processing requires valid payment confirmation. Users must provide a genuine UTR or Transaction Reference Number after scanning the payment QR code. Fake or misleading transaction entries will lead to immediate cancellation of application processing.</p>
                    </div>

                    <div>
                      <h4 className="font-extrabold text-slate-900 text-sm mb-1">4. Non-Affiliation Disclaimer</h4>
                      <p>SGS ONLINE SERVICE is a private assistance portal and does not claim to be an official government entity or official government website unless explicitly stated. All official application fees are remitted according to respective official guidelines.</p>
                    </div>

                    <div>
                      <h4 className="font-extrabold text-slate-900 text-sm mb-1">5. Support & Query Resolution</h4>
                      <p>For any queries, submission verification, or support regarding online forms, users can access our WhatsApp or Email support channels available in the side drawer menu to receive automated Ticket tracking support.</p>
                    </div>
                  </div>
                )}
              </div>

              <div className="p-3 bg-white border-t border-slate-200 flex justify-end shrink-0">
                <button onClick={() => setActiveModalPage(null)} className="bg-slate-900 text-white font-bold px-6 py-2 rounded-xl text-xs shadow-md">
                  Close Window
                </button>
              </div>
            </div>
          ) : (
            <>
              {/* STICKY HEADER */}
              <header className="sticky top-0 z-40 bg-gradient-to-r from-blue-700 via-indigo-700 to-purple-800 text-white shadow-sm py-2 px-3">
                <div className="max-w-6xl mx-auto flex items-center justify-between gap-2">
                  <button onClick={() => setShowDrawer(true)} className="p-1.5 text-white hover:bg-white/10 rounded-lg">
                    <Icons.Menu />
                  </button>
                  <div onClick={() => { setSelectedCat('All Services'); setActiveService(null); }} className="cursor-pointer text-center flex-1">
                    <h1 className="text-base sm:text-xl font-extrabold text-yellow-300">SGS ONLINE SERVICE</h1>
                    <p className="text-[9px] sm:text-[11px] font-bold text-amber-200/90 uppercase">Government & College Online Form Seva Portal</p>
                  </div>
                </div>
              </header>

              {/* MAIN SERVICES CONTENT */}
              {activeService ? (
                <main className="flex-1 w-full mx-auto px-4 py-6">
                  <button onClick={() => setActiveService(null)} className="inline-flex items-center gap-2 bg-white text-slate-800 font-bold text-xs px-4 py-2 rounded-xl border border-slate-300 mb-4 shadow-2xs">
                    <Icons.ArrowLeft /> Back to Services
                  </button>

                  <div className="bg-white rounded-xl shadow-md border border-slate-200 overflow-hidden p-5 sm:p-6">
                    <span className="bg-blue-600 text-white text-[10px] font-bold px-2 py-0.5 rounded uppercase">{activeService.category}</span>
                    <h2 className="text-xl sm:text-2xl font-black text-slate-900 mt-2 mb-2">{activeService.title}</h2>
                    <p className="text-xs text-slate-600 mb-6">{activeService.description}</p>

                    <form onSubmit={handleFormSubmit} className="space-y-4">
                      {activeService.fields && activeService.fields.map((field, idx) => (
                        <div key={idx} className="space-y-1">
                          <label className="block text-xs font-bold text-slate-800">{field.label}:</label>
                          {field.type === 'file' ? (
                            <div>
                              <input 
                                type="file" 
                                name={field.name} 
                                accept={field.accept || "image/*, application/pdf"} 
                                required={field.required}
                                onChange={(e) => handleFilePreview(e, `prev_img_${field.name}_${idx}`, `prev_pdf_${field.name}_${idx}`)}
                                className="w-full bg-slate-50 border border-slate-300 rounded-lg p-2 text-xs" 
                              />
                              <img id={`prev_img_${field.name}_${idx}`} className="img-preview" alt="Selected Preview" />
                              <div id={`prev_pdf_${field.name}_${idx}`} className="pdf-preview"></div>
                            </div>
                          ) : field.type === 'radio' ? (
                            <div className="space-y-2 bg-slate-50 p-3 rounded-lg border border-slate-200">
                              {field.options && field.options.map((opt) => (
                                <label key={opt.id || opt.value} className="flex items-center gap-2 text-xs font-semibold text-slate-700 cursor-pointer">
                                  <input
                                    type="radio"
                                    name={field.name}
                                    value={opt.value}
                                    required={field.required}
                                    className="w-4 h-4 text-blue-600 focus:ring-blue-500"
                                  />
                                  <span>{opt.label}</span>
                                </label>
                              ))}
                            </div>
                          ) : (
                            <input 
                              type={field.type} 
                              name={field.name} 
                              required={field.required} 
                              placeholder={field.placeholder || "Details fill karein"}
                              className="w-full bg-slate-50 border border-slate-300 rounded-lg p-2.5 text-xs font-medium focus:outline-none focus:border-blue-600" 
                            />
                          )}
                        </div>
                      ))}

                      <div className="bg-blue-50/80 border border-blue-200 p-4 rounded-xl text-center my-4">
                        <p className="text-xs font-extrabold text-blue-900 mb-2">Scan QR & Pay Application Fee</p>
                        <img src={activeService.qrImageUrl} alt="Payment QR Code" className="max-w-[180px] mx-auto rounded-lg border-2 border-blue-600 shadow-sm" />
                      </div>

                      <div className="space-y-1">
                        <label className="block text-xs font-extrabold text-rose-600">Payment UTR / Transaction ID (Mandatory):</label>
                        <input 
                          type="text" 
                          name="utr_number" 
                          required 
                          placeholder="12-digit UTR or Ref Number daalein" 
                          className="w-full bg-slate-50 border border-rose-300 rounded-lg p-2.5 text-xs font-bold text-slate-900 focus:outline-none focus:border-rose-600" 
                        />
                      </div>

                      <button 
                        type="submit" 
                        disabled={isSubmitting}
                        className="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-extrabold text-sm py-3.5 rounded-xl shadow-lg transition-all active:scale-95 disabled:bg-slate-400 mt-2"
                      >
                        {isSubmitting ? "Uploading & Submitting..." : "Submit Application →"}
                      </button>
                    </form>
                  </div>
                </main>
              ) : (
                <main className="flex-1 w-full mx-auto px-4 py-6 space-y-6">
                  <div className="bg-white border border-slate-300 rounded-xl p-4 shadow-2xs">
                    <div className="flex items-center gap-2 border-b border-slate-200 pb-2 mb-3">
                      <span className="text-blue-700"><Icons.Bell /></span>
                      <h2 className="font-extrabold text-slate-900 text-sm uppercase">Notice Board</h2>
                    </div>
                    <div className="space-y-2">
                      {notices.map((n) => (
                        <div key={n.id} className="flex items-start gap-2 text-xs font-medium text-slate-800 border-b border-slate-100 pb-1.5 last:border-0">
                          <span className="text-blue-600 font-bold">•</span>
                          <span>{n.text}</span>
                        </div>
                      ))}
                    </div>
                  </div>

                  <div className="space-y-3">
                    <div className="relative">
                      <div className="absolute left-3.5 top-3 text-slate-400"><Icons.Search /></div>
                      <input
                        type="text"
                        value={searchQuery}
                        onChange={(e) => setSearchQuery(e.target.value)}
                        placeholder="Search form, service..."
                        className="w-full bg-white border border-slate-300 rounded-xl pl-10 pr-4 py-2.5 text-xs sm:text-sm font-medium focus:outline-none focus:border-blue-600"
                      />
                    </div>

                    <div className="flex items-center gap-2 overflow-x-auto pb-1 scrollbar-none">
                      {categories.map((catObj) => {
                        const catName = typeof catObj === 'object' ? catObj.name : catObj;
                        const isSelected = selectedCat === catName;
                        return (
                          <button
                            key={catName}
                            onClick={() => {
                              if (catName !== selectedCat) {
                                window.history.pushState({ page: 'category' }, '');
                                setSelectedCat(catName);
                              }
                            }}
                            style={getCategoryButtonStyle(catObj, isSelected)}
                            className="px-3.5 py-1.5 rounded-lg text-xs font-bold transition-all border shrink-0"
                          >
                            {catName}
                          </button>
                        );
                      })}
                    </div>
                  </div>

                  <div className="grid grid-cols-1 gap-4">
                    {filteredServices.map((srv) => (
                      <div
                        key={srv.id}
                        onClick={() => openServiceDetail(srv)}
                        className="bg-white rounded-xl border border-slate-300 p-4 shadow-2xs hover:shadow-md transition-all cursor-pointer flex flex-col justify-between"
                      >
                        <div>
                          <span className="bg-slate-100 text-slate-700 text-[10px] font-bold px-2 py-0.5 rounded border border-slate-200">
                            {srv.category}
                          </span>
                          <h4 className="font-bold text-slate-900 text-sm mt-2">{srv.title}</h4>
                          <p className="text-xs text-slate-500 mt-1 line-clamp-2">{srv.description}</p>
                        </div>

                        <div className="pt-4 border-t border-slate-100 flex items-center justify-between text-xs font-bold text-blue-700 mt-3">
                          <span>Apply Now & Fill Details</span>
                          <Icons.ChevronRight />
                        </div>
                      </div>
                    ))}
                  </div>
                </main>
              )}

              {/* FOOTER */}
              <footer className="bg-slate-900 text-slate-400 text-xs py-6 mt-12 border-t border-slate-800 text-center">
                <p className="font-bold text-white">SGS ONLINE SERVICE © 2026</p>
                <div className="flex items-center justify-center gap-4 text-xs mt-2">
                  <button onClick={() => { window.history.pushState({ page: 'modal' }, ''); setActiveModalPage('privacy'); }} className="text-slate-400 hover:text-white underline">Privacy Policy</button>
                  <button onClick={() => { window.history.pushState({ page: 'modal' }, ''); setActiveModalPage('terms'); }} className="text-slate-400 hover:text-white underline">Terms & Conditions</button>
                </div>
              </footer>
            </>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
