      perspective: 1200px;
    }
    .card-3d-wrap {

      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.4s ease;

    .card-3d-wrap:hover {
      transform: translateY(-8px) rotateX(4deg) rotateY(-2deg) scale(1.02);
      box-shadow: 0 25px 35px -10px rgba(79, 70, 229, 0.4), 0 0 25px 2px rgba(245, 158, 11, 0.25);
    }

    /* Live Blinking Red Text Animation with Pulse Ring */
    @keyframes livePulse {
      0%, 100% { 
        opacity: 1; 
        transform: scale(1); 
        box-shadow: 0 0 14px rgba(239, 68, 68, 0.9), 0 0 28px rgba(239, 68, 68, 0.5); 
      }
      50% { 
        opacity: 0.35; 
        transform: scale(0.95); 
        box-shadow: 0 0 4px rgba(239, 68, 68, 0.2); 
      }
    }
    .live-blink-text {
      animation: livePulse 1.2s infinite ease-in-out;
    }

    /* Shimmer Effect for Accent Cards */
    @keyframes shimmer {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }
    .shimmer-bg {
      background: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.1) 50%, rgba(255,255,255,0) 100%);
      background-size: 200% 100%;
      animation: shimmer 2.8s infinite;
    }

    /* Floating Animation for 3D elements */
    @keyframes floatBobbing {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-10px) rotate(1deg); }
    }
    .animate-float-slow {
      animation: floatBobbing 5s ease-in-out infinite;

    .gradient-text-gold {

    // 3D ANIMATED AVATAR/CHARACTER FOR LOGIN PAGE
    function ThreeWelcomeAvatar() {
      const mountRef = useRef(null);

      useEffect(() => {
        const container = mountRef.current;
        if (!container) return;

        // Scene, Camera, Renderer
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
        camera.position.set(0, 1.2, 4.5);

        const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xf59e0b, 1.5);
        dirLight.position.set(5, 10, 7);
        scene.add(dirLight);

        const pointLight = new THREE.PointLight(0x6366f1, 2, 10);
        pointLight.position.set(-3, 2, 3);
        scene.add(pointLight);

        // 3D Avatar Character Group
        const characterGroup = new THREE.Group();

        // 1. Head (Metallic Golden Sphere)
        const headGeo = new THREE.SphereGeometry(0.6, 32, 32);
        const headMat = new THREE.MeshStandardMaterial({
          color: 0x1e1b4b,
          metalness: 0.8,
          roughness: 0.2,
          emissive: 0x312e81,
          emissiveIntensity: 0.3
        });
        const head = new THREE.Mesh(headGeo, headMat);
        head.position.y = 0.9;
        characterGroup.add(head);

        // 2. Eyes (Glowing Cyan Spheres)
        const eyeGeo = new THREE.SphereGeometry(0.1, 16, 16);
        const eyeMat = new THREE.MeshBasicMaterial({ color: 0x38bdf8 });
        
        const leftEye = new THREE.Mesh(eyeGeo, eyeMat);
        leftEye.position.set(-0.2, 0.98, 0.52);
        characterGroup.add(leftEye);

        const rightEye = new THREE.Mesh(eyeGeo, eyeMat);
        rightEye.position.set(0.2, 0.98, 0.52);
        characterGroup.add(rightEye);

        // Visor Glow Glass
        const visorGeo = new THREE.CylinderGeometry(0.45, 0.45, 0.2, 32, 1, false, 0, Math.PI);
        const visorMat = new THREE.MeshPhysicalMaterial({
          color: 0xf59e0b,
          transmission: 0.6,
          opacity: 1,
          transparent: true,
          roughness: 0.1
        });
        const visor = new THREE.Mesh(visorGeo, visorMat);
        visor.rotation.y = Math.PI / 2;
        visor.position.set(0, 0.96, 0.2);
        characterGroup.add(visor);

        // 3. Body (Cyber Torso)
        const bodyGeo = new THREE.CylinderGeometry(0.4, 0.25, 0.9, 32);
        const bodyMat = new THREE.MeshStandardMaterial({
          color: 0x0f172a,
          metalness: 0.9,
          roughness: 0.3
        });
        const body = new THREE.Mesh(bodyGeo, bodyMat);
        body.position.y = 0.15;
        characterGroup.add(body);

        // 4. Glowing Core Emblem (SGS Gem)
        const gemGeo = new THREE.OctahedronGeometry(0.18);
        const gemMat = new THREE.MeshBasicMaterial({ color: 0xf59e0b, wireframe: true });
        const gem = new THREE.Mesh(gemGeo, gemMat);
        gem.position.set(0, 0.25, 0.38);
        characterGroup.add(gem);

        // 5. Floating Hands
        const handGeo = new THREE.SphereGeometry(0.14, 16, 16);
        const handMat = new THREE.MeshStandardMaterial({ color: 0xd97706, metalness: 0.7 });
        
        const leftHand = new THREE.Mesh(handGeo, handMat);
        leftHand.position.set(-0.65, 0.15, 0.2);
        characterGroup.add(leftHand);

        const rightHand = new THREE.Mesh(handGeo, handMat);
        rightHand.position.set(0.65, 0.15, 0.2);
        characterGroup.add(rightHand);

        // 6. Holographic Orbit Rings
        const ringGeo = new THREE.TorusGeometry(1.1, 0.02, 16, 100);
        const ringMat = new THREE.MeshBasicMaterial({ color: 0x6366f1, transparent: true, opacity: 0.6 });
        const ring1 = new THREE.Mesh(ringGeo, ringMat);
        ring1.rotation.x = Math.PI / 3;
        characterGroup.add(ring1);

        const ring2 = new THREE.Mesh(ringGeo, new THREE.MeshBasicMaterial({ color: 0xf59e0b, transparent: true, opacity: 0.5 }));
        ring2.rotation.y = Math.PI / 4;
        characterGroup.add(ring2);

        scene.add(characterGroup);

        // Mouse Move Interactive Head Rotation
        let mouseX = 0, mouseY = 0;
        const handleMouseMove = (e) => {
          const rect = container.getBoundingClientRect();
          mouseX = ((e.clientX - rect.left) / container.clientWidth) * 2 - 1;
          mouseY = -((e.clientY - rect.top) / container.clientHeight) * 2 + 1;
        };
        window.addEventListener('mousemove', handleMouseMove);

        // Animation Loop
        let clock = new THREE.Clock();
        let animationFrameId;

        const animate = () => {
          animationFrameId = requestAnimationFrame(animate);
          const elapsedTime = clock.getElapsedTime();

          // Idle Bobbing Animation
          characterGroup.position.y = Math.sin(elapsedTime * 2) * 0.1;
          
          // Rotate Hologram Rings & Gem
          ring1.rotation.z = elapsedTime * 0.8;
          ring2.rotation.x = elapsedTime * 0.6;
          gem.rotation.y = elapsedTime * 1.5;

          // Float hands
          leftHand.position.y = 0.15 + Math.sin(elapsedTime * 3) * 0.05;
          rightHand.position.y = 0.15 + Math.cos(elapsedTime * 3) * 0.05;

          // Head tracking mouse
          characterGroup.rotation.y = THREE.MathUtils.lerp(characterGroup.rotation.y, mouseX * 0.4, 0.08);
          characterGroup.rotation.x = THREE.MathUtils.lerp(characterGroup.rotation.x, -mouseY * 0.2, 0.08);

          renderer.render(scene, camera);
        };

        animate();

        // Resize handler
        const handleResize = () => {
          if (!container) return;
          camera.aspect = container.clientWidth / container.clientHeight;
          camera.updateProjectionMatrix();
          renderer.setSize(container.clientWidth, container.clientHeight);
        };
        window.addEventListener('resize', handleResize);

        return () => {
          window.removeEventListener('mousemove', handleMouseMove);
          window.removeEventListener('resize', handleResize);
          cancelAnimationFrame(animationFrameId);
          if (container && renderer.domElement) {
            container.removeChild(renderer.domElement);
          }
        };
      }, []);

      return <div ref={mountRef} className="w-full h-56 sm:h-64 cursor-grab active:cursor-grabbing" />;
    }
