    // HIGH QUALITY HD IMAGE COMPRESSION (1600px Max, 85% Quality)
    const compressImage = (file) => {
      return new Promise((resolve) => {
        if (!file || file.type === 'application/pdf' || !file.type.startsWith('image/')) {
          resolve(file);
          return;
        }
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (event) => {
          const img = new Image();
          img.src = event.target.result;
          img.onload = () => {
            const canvas = document.createElement('canvas');
            const maxWidth = 1600;
            const scaleSize = maxWidth / img.width;
            
            if (scaleSize < 1) {
              canvas.width = maxWidth;
              canvas.height = img.height * scaleSize;
            } else {
              canvas.width = img.width;
              canvas.height = img.height;
            }

            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            
            canvas.toBlob((blob) => {
              if (blob) {
                const compressedFile = new File([blob], file.name, {
                  type: 'image/jpeg',
                  lastModified: Date.now()
                });
                resolve(compressedFile);
              } else {
                resolve(file);
              }
            }, 'image/jpeg', 0.85);
          };
        };
      });
    };

                    </form>
                  </div>
                </main>
              ) : (
                <main className="flex-1 max-w-6xl w-full mx-auto px-4 py-6 space-y-6">
                  {/* COLORFUL NOTICE BOARD WITH BLINKING LIVE BUTTON */}
                  <div className="bg-gradient-to-r from-blue-50 via-indigo-50 to-purple-50 border border-indigo-200 rounded-2xl p-4 shadow-sm relative overflow-hidden">
                    <div className="flex items-center justify-between border-b border-indigo-100 pb-2.5 mb-3">
                      <div className="flex items-center gap-2">
                        <span className="text-indigo-600 animate-bounce"><Icons.Bell /></span>
                        <h2 className="font-black text-indigo-950 text-sm uppercase tracking-wider">Notice Board</h2>
                      </div>
                      
                      {/* BLINKING LIVE BUTTON */}
                      <span className="inline-flex items-center gap-1.5 bg-rose-600 text-white font-extrabold text-[10px] px-2.5 py-0.5 rounded-full shadow-md tracking-wider">
                        <span className="w-2 h-2 rounded-full bg-amber-300 animate-ping"></span>
                        LIVE
                      </span>
                    </div>

                    <div className="space-y-2.5">
                      {notices.map((n) => (
                        <div key={n.id} className="flex items-start gap-2.5 text-xs font-semibold text-slate-800 bg-white/80 p-2 rounded-xl border border-indigo-100/60 shadow-2xs">
                          <span className="text-indigo-600 font-extrabold text-sm leading-none">•</span>
                          <span className="leading-relaxed">{n.text}</span>
                        </div>
                      ))}
                    </div>
                  </div>

                  <div className="space-y-3">
                    <div className="relative">
                      <div className="absolute left-3.5 top-3 text-slate-400"><Icons.Search /></div>
                      <input
                        type="text"
                        value={searchQuery}
                        onChange={(e) => setSearchQuery(e.target.value)}
                        placeholder="Search form, service..."
                        className="w-full bg-white border border-slate-300 rounded-xl pl-10 pr-4 py-2.5 text-xs sm:text-sm font-medium focus:outline-none focus:border-blue-600"
                      />
                    </div>

                    <div className="flex items-center gap-2 overflow-x-auto pb-1 scrollbar-none">
                      {categories.map((catObj) => {
                        const catName = typeof catObj === 'object' ? catObj.name : catObj;
                        const isSelected = selectedCat === catName;
                        return (
                          <button
                            key={catName}
                            onClick={() => {
                              if (catName !== selectedCat) {
                                window.history.pushState({ page: 'category' }, '');
                                setSelectedCat(catName);
                              }
                            }}
                            style={getCategoryButtonStyle(catObj, isSelected)}
                            className="px-3.5 py-1.5 rounded-lg text-xs font-bold transition-all border shrink-0"
                          >
                            {catName}
                          </button>
                        );
                      })}
                    </div>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                    {filteredServices.map((srv) => (
                      <div
                        key={srv.id}
                        onClick={() => openServiceDetail(srv)}
                        className="bg-white rounded-xl border border-slate-300 p-4 shadow-2xs hover:shadow-md transition-all cursor-pointer flex flex-col justify-between"
                      >
                        <div>
                          <span className="bg-slate-100 text-slate-700 text-[10px] font-bold px-2 py-0.5 rounded border border-slate-200">
                            {srv.category}
                          </span>
                          <h4 className="font-bold text-slate-900 text-sm mt-2">{srv.title}</h4>
                          <p className="text-xs text-slate-500 mt-1 line-clamp-2">{srv.description}</p>
                        </div>

                        <div className="pt-4 border-t border-slate-100 flex items-center justify-between text-xs font-bold text-blue-700 mt-3">
                          <span>Apply Now & Fill Details</span>
                          <Icons.ChevronRight />
                        </div>
                      </div>
                    ))}
                  </div>
                </main>
              )}

              {/* FOOTER WITH MODAL BUTTONS */}
              <footer className="bg-slate-900 text-slate-400 text-xs py-6 mt-12 border-t border-slate-800 text-center px-4">
                <p className="font-bold text-white">SGS ONLINE SERVICE © 2026</p>
                <div className="flex flex-wrap items-center justify-center gap-4 text-xs mt-3">
                  <button onClick={() => { window.history.pushState({ page: 'modal' }, ''); setActiveModalPage('privacy'); }} className="text-slate-400 hover:text-white underline">Privacy Policy</button>
                  <button onClick={() => { window.history.pushState({ page: 'modal' }, ''); setActiveModalPage('terms'); }} className="text-slate-400 hover:text-white underline">Terms & Conditions</button>
                  <button onClick={() => { window.history.pushState({ page: 'modal' }, ''); setActiveModalPage('disclaimer'); }} className="text-slate-400 hover:text-white underline">Disclaimer</button>
                </div>
              </footer>
            </>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
