    const compressImage = (file) => {
      return new Promise((resolve) => {
        if (!file || file.type === 'application/pdf' || !file.type.startsWith('image/')) {
          resolve(file);
          return;
        }
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (event) => {
          const img = new Image();
          img.src = event.target.result;
          img.onload = () => {
            const canvas = document.createElement('canvas');
            const maxWidth = 1600;
            const scaleSize = maxWidth / img.width;
            
            if (scaleSize < 1) {
              canvas.width = maxWidth;
              canvas.height = img.height * scaleSize;
            } else {
              canvas.width = img.width;
              canvas.height = img.height;
            }

            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            
            canvas.toBlob((blob) => {
              if (blob) {
                const compressedFile = new File([blob], file.name, {
                  type: 'image/jpeg',
                  lastModified: Date.now()
                });
                resolve(compressedFile);
              } else {
                resolve(file);
              }
            }, 'image/jpeg', 0.85);
          };
        };
      });
    };

        textDetails += `🆔 *UID:* \`${submissionId}\`\n`;
        textDetails += `📌 *Service:* ${activeService.title}\n\n`;

        const rawFileInputs = [];

        if (activeService.fields) {
          activeService.fields.forEach((f) => {
            if (f.type === 'file') {
              const fileObj = formData.get(f.name);
              if (fileObj && fileObj instanceof File && fileObj.size > 0) {
                rawFileInputs.push({ label: f.label, name: f.name, file: fileObj });
              }
            } else if (f.type === 'radio') {
              const selectedValue = formData.get(f.name);
              let selectedLabel = selectedValue;
              if (f.options) {
                const optObj = f.options.find(o => o.value === selectedValue);
                if (optObj) selectedLabel = optObj.label;
              }
              textDetails += `• *${f.label}:* ${selectedLabel || 'Not Selected'}\n`;
            } else {
              const val = formData.get(f.name);
              if (val) {
                textDetails += `• *${f.label}:* ${val}\n`;
              }
            }
          });
        }

        const utrVal = formData.get("utr_number");
        const dateStr = new Date().toLocaleString();
        textDetails += `\n💳 *UTR / Transaction ID:* \`${utrVal || 'N/A'}\`\n`;
        textDetails += `📅 *Date:* ${dateStr}`;

        try {
          await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              chat_id: TELEGRAM_CHAT_ID,
              text: textDetails,
              parse_mode: "Markdown"
            })
          });

          const processedFiles = await Promise.all(
            rawFileInputs.map(async (item) => {
              const fileObj = await compressImage(item.file);
              return { label: item.label, name: item.name, file: fileObj };
            })
          );

          for (const item of processedFiles) {
            const fileData = new FormData();
            fileData.append("chat_id", TELEGRAM_CHAT_ID);
            
            const isPdf = item.file.type === 'application/pdf';
            const endpoint = isPdf ? 'sendDocument' : 'sendPhoto';
            const paramName = isPdf ? 'document' : 'photo';

            fileData.append(paramName, item.file);
            fileData.append("caption", `📎 ${item.label}\nUID: ${submissionId}`);

            await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/${endpoint}`, {
              method: "POST",
              body: fileData
            });
          }

          const newAppItem = {
            uid: submissionId,
            serviceTitle: activeService.title

          const updatedApps = [newAppItem, ...userApps];
          setUserApps(updatedApps);
          localStorage.setItem('sgs_user_applications', JSON.stringify(updatedApps));

          document.querySelectorAll('.img-preview').forEach(img => img.style.display = 'none');
          document.querySelectorAll('.pdf-preview').forEach(pdf => pdf.style.display = 'none');

                    <div className="space-y-2">
                      {notices.map((n) => (
                        <div key={n.id} className="flex items-start gap-2 text-xs font-medium text-slate-800 border-b border-slate-100 pb-1.5 last:border-0">
                          <span className="text-blue-600 font-bold">•</span>
                          <span>{n.text}</span>
                        </div>
                      ))}
                    </div>
                  </div>

                  <div className="space-y-3">
                    <div className="relative">
                      <div className="absolute left-3.5 top-3 text-slate-400"><Icons.Search /></div>
                      <input
                        type="text"
                        value={searchQuery}
                        onChange={(e) => setSearchQuery(e.target.value)}
                        placeholder="Search form, service..."
                        className="w-full bg-white border border-slate-300 rounded-xl pl-10 pr-4 py-2.5 text-xs sm:text-sm font-medium focus:outline-none focus:border-blue-600"
                      />
                    </div>
                  </div>

                  <div className="grid grid-cols-1 gap-4">
                    {filteredServices.map((srv) => (
                      <div
                        key={srv.id}
                        onClick={() => openServiceDetail(srv)}
                        className="bg-white rounded-xl border border-slate-300 p-4 shadow-2xs hover:shadow-md transition-all cursor-pointer flex flex-col justify-between"
                      >
                        <div>
                          <span className="bg-slate-100 text-slate-700 text-[10px] font-bold px-2 py-0.5 rounded border border-slate-200">
                            {srv.category}
                          </span>
                          <h4 className="font-bold text-slate-900 text-sm mt-2">{srv.title}</h4>
                          <p className="text-xs text-slate-500 mt-1 line-clamp-2">{srv.description}</p>
                        </div>

                        <div className="pt-4 border-t border-slate-100 flex items-center justify-between text-xs font-bold text-blue-700 mt-3">
                          <span>Apply Now & Fill Details</span>
                          <Icons.ChevronRight />
                        </div>
                      </div>
                    ))}
                  </div>
                </main>
              )}

              {/* FIXED BOTTOM NAVIGATION BAR FOR CATEGORIES */}
              <nav className="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-white border-t border-slate-200 shadow-lg z-30 flex items-center overflow-x-auto scrollbar-none py-2 px-2 gap-2">
                {categories.map((catObj) => {
                  const catName = typeof catObj === 'object' ? catObj.name : catObj;
                  const isSelected = selectedCat === catName;
                  return (
                    <button
                      key={catName}
                      onClick={() => {
                        window.history.pushState({ page: 'category' }, '');
                        setSelectedCat(catName);
                        setActiveService(null);
                      }}
                      style={getCategoryButtonStyle(catObj, isSelected)}
                      className="px-3 py-1.5 rounded-xl text-[11px] font-extrabold transition-all border shrink-0 whitespace-nowrap"
                    >
                      {catName}
                    </button>
                  );
                })}
              </nav>

              {/* FOOTER */}
              <footer className="bg-slate-900 text-slate-400 text-xs py-6 mt-12 mb-12 border-t border-slate-800 text-center">
                <p className="font-bold text-white">SGS ONLINE SERVICE © 2026</p>
                <div className="flex items-center justify-center gap-4 text-xs mt-2">
                  <button onClick={() => { window.history.pushState({ page: 'modal' }, ''); setActiveModalPage('privacy'); }} className="text-slate-400 hover:text-white underline">Privacy Policy</button>
                  <button onClick={() => { window.history.pushState({ page: 'modal' }, ''); setActiveModalPage('terms'); }} className="text-slate-400 hover:text-white underline">Terms & Conditions</button>
                </div>
              </footer>
            </>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
