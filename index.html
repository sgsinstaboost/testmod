    // HIGH QUALITY HD IMAGE COMPRESSION
    const compressImage = (file) => {
      return new Promise((resolve) => {
        if (!file || file.type === 'application/pdf' || !file.type.startsWith('image/')) {
          resolve(file);
          return;
        }
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (event) => {
          const img = new Image();
          img.src = event.target.result;
          img.onload = () => {
            const canvas = document.createElement('canvas');
            canvas.width = img.width;
            canvas.height = img.height;

            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            
            canvas.toBlob((blob) => {
              if (blob) {
                const compressedFile = new File([blob], file.name, {
                  type: 'image/jpeg',
                  lastModified: Date.now()
                });
                resolve(compressedFile);
              } else {
                resolve(file);
              }
            }, 'image/jpeg', 0.92);
          };
        };
      });
    };

          const textParam = parsedUrl.searchParams.get("text");
          if (textParam) {

            const am = upiUrl.searchParams.get("am");
            if (am) return am;
          }
        }

      return "230";

              <div className="bg-slate-900 text-slate-200 text-[11px] px-4 py-2 border-b border-orange-500/30 text-center font-medium">
                <span className="bg-gradient-to-r from-orange-500 to-emerald-600 text-white font-black px-2 py-0.5 rounded text-[10px] mr-1.5 shadow">🇮🇳 NOTICE</span>
                SGS Online Service is an independent private form filling assistance portal (Cyber Cafe). We are NOT an official government or college portal.
              </div>

              {/* MAIN SERVICES CONTENT */}
              {activeService ? (
                <main className="flex-1 max-w-4xl w-full mx-auto px-4 py-6">
                  <button onClick={handleNavigateHome} className="inline-flex items-center gap-2 bg-white text-slate-800 font-bold text-xs px-4 py-2 rounded-xl border border-orange-200 mb-4 shadow-2xs hover:bg-orange-50">
                    <Icons.ArrowLeft /> Back to Services
                  </button>

                  <div className="bg-white rounded-xl shadow-md border-2 border-orange-400 overflow-hidden p-4 sm:p-6 relative">
                    <div className="absolute top-0 left-0 right-0 h-1.5 tiranga-stripe"></div>
                    <span className="bg-gradient-to-r from-orange-600 to-emerald-600 text-white text-[10px] font-extrabold px-2.5 py-0.5 rounded uppercase mt-2 inline-block">{activeService.category}</span>
                    <h2 className="text-xl sm:text-2xl font-black text-slate-900 mt-2 mb-2">{activeService.title}</h2>
                    <p className="text-xs text-slate-600 mb-4">{activeService.description}</p>

                    {/* DUAL MODE CHECK: FULL HTML OR DYNAMIC FIELDS FORM */}
                    {activeService.htmlContent ? (
                      <div className="w-full rounded-xl overflow-hidden border border-slate-200 mt-3 bg-white">
                        <iframe 
                          srcDoc={activeService.htmlContent} 
                          title={activeService.title} 
                          className="w-full min-h-[600px] border-0" 
                          sandbox="allow-scripts allow-forms allow-same-origin allow-popups"
                        />
                      </div>
                    ) : (
                      <>
                        {/* Form Filling Transparency Note */}
                        <div className="bg-orange-50 warning-amber-box border border-orange-200 rounded-lg p-3 text-[11px] text-orange-950 font-medium mb-5">
                          ℹ️ <strong>Assistance Notice:</strong> Information submitted below will be used by our team to fill out your official online form on your behalf after phone confirmation. Turnaround time: 24 to 48 working hours.
                        </div>

                        <form onSubmit={handleFormSubmit} className="space-y-4">
                          {activeService.fields && activeService.fields.map((field, idx) => {
                            const isPhoneField = field.type === 'tel' || field.name?.toLowerCase().includes('mobile') || field.name?.toLowerCase().includes('phone') || field.label?.toLowerCase().includes('mobile') || field.label?.toLowerCase().includes('phone');

                            return (
                              <div key={idx} className="space-y-1">
                                <label className="block text-xs font-bold text-slate-800">{field.label}:</label>
                                {field.type === 'file' ? (
                                  <div>
                                    <input 
                                      type="file" 
                                      name={field.name} 
                                      accept={field.accept || "image/*, application/pdf"} 
                                      required={field.required}
                                      onChange={(e) => handleFilePreview(e, `prev_img_${field.name}_${idx}`, `prev_pdf_${field.name}_${idx}`)}
                                      className="w-full bg-slate-50 border border-slate-300 rounded-lg p-2 text-xs focus:border-orange-500" 
                                    />
                                    <img id={`prev_img_${field.name}_${idx}`} className="img-preview" alt="Selected Preview" />
                                    <div id={`prev_pdf_${field.name}_${idx}`} className="pdf-preview"></div>
                                  </div>
                                ) : field.type === 'radio' ? (
                                  <div className="space-y-2 bg-slate-50 p-3 rounded-lg border border-slate-200">
                                    {field.options && field.options.map((opt) => (
                                      <label key={opt.id || opt.value} className="flex items-center gap-2 text-xs font-semibold text-slate-700 cursor-pointer">
                                        <input
                                          type="radio"
                                          name={field.name}
                                          value={opt.value}
                                          required={field.required}
                                          className="w-4 h-4 text-orange-600 focus:ring-orange-500"
                                        />
                                        <span>{opt.label}</span>
                                      </label>
                                    ))}
                                  </div>
                                ) : isPhoneField ? (
                                  /* MOBILE NUMBER DIALER FIELD WITH FIXED +91 PREFIX & 10 DIGIT LIMIT */
                                  <div className="flex items-center">
                                    <span className="bg-orange-100 border border-r-0 border-orange-300 rounded-l-lg p-2.5 text-xs font-bold text-orange-900 prefix-badge shrink-0">
                                      +91
                                    </span>
                                    <input 
                                      type="tel" 
                                      inputMode="numeric"
                                      pattern="[0-9]{10}"
                                      maxLength={10}
                                      name={field.name} 
                                      required={field.required} 
                                      placeholder="10 digit mobile number"
                                      onInput={(e) => {
                                        e.target.value = e.target.value.replace(/[^0-9]/g, '').slice(0, 10);
                                      }}
                                      className="w-full bg-slate-50 border border-slate-300 rounded-r-lg p-2.5 text-xs font-bold tracking-wide text-slate-900 focus:outline-none focus:border-orange-500" 
                                    />
                                  </div>
                                ) : (
                                  <input 
                                    type={field.type} 
                                    name={field.name} 
                                    required={field.required} 
                                    placeholder={field.placeholder || "Details fill karein"}
                                    className="w-full bg-slate-50 border border-slate-300 rounded-lg p-2.5 text-xs font-medium focus:outline-none focus:border-orange-500" 
                                  />
                                )}
                              </div>
                            );
                          })}

                          {/* OFFICIAL COMPLIANT PAYU CHECKOUT SUMMARY & PAYMENT GATEWAY SUBMIT CARD */}
                          <div className="bg-slate-50 border-2 border-orange-300 rounded-2xl p-4 my-5 shadow-sm space-y-3">
                            <div className="flex items-center justify-between border-b border-slate-200 pb-2">
                              <span className="text-xs font-extrabold text-slate-700 flex items-center gap-1.5">
                                <Icons.CreditCard /> Online Application Fee & Processing Charge
                              </span>
                              <span className="text-[10px] bg-emerald-100 text-emerald-800 font-bold px-2 py-0.5 rounded-full">
                                PayU Verified Checkout
                              </span>
                            </div>

                            <div className="space-y-1.5 text-xs">
                              <div className="flex justify-between text-slate-600">
                                <span>Selected Service:</span>
                                <span className="font-semibold text-slate-900">{activeService.title}</span>
                              </div>
                              <div className="flex justify-between text-slate-600">
                                <span>Assistance & Facilitation Charge:</span>
                                <span className="font-semibold text-slate-900">Included</span>
                              </div>
                              <div className="flex justify-between text-slate-900 font-black text-sm pt-2 border-t border-dashed border-slate-300">
                                <span>Total Amount to Pay:</span>
                                <span className="text-orange-600 text-base">₹{getServiceAmount(activeService)}</span>
                              </div>
                            </div>

                            <div className="pt-2">
                              <button 
                                type="submit" 
                                disabled={isSubmitting}
                                className="w-full tiranga-btn-primary font-extrabold text-sm py-3.5 rounded-xl shadow-lg transition-all active:scale-95 disabled:bg-slate-400 flex items-center justify-center gap-2"
                              >
                                {isSubmitting ? "Connecting to PayU Secure Gateway..." : `Pay ₹${getServiceAmount(activeService)} via PayU Gateway →`}
                              </button>
                            </div>

                            <p className="text-[10px] text-center text-slate-500 font-medium">
                              🔒 <Icons.LockClosed /> 256-Bit SSL Encrypted Transaction. Official receipt will be delivered upon successful payment.
                            </p>
                          </div>
                        </form>
                      </>
                    )}
                  </div>
                </main>
              ) : (
                <main className="flex-1 max-w-6xl w-full mx-auto px-4 py-6 space-y-6">
                  {/* COLORFUL TIRANGA NOTICE BOARD WITH BLINKING LIVE BUTTON */}
                  <div className="notice-board-box bg-gradient-to-r from-orange-50 via-white to-emerald-50 border-2 border-orange-300 rounded-2xl p-4 shadow-sm relative overflow-hidden">
                    <div className="flex items-center justify-between border-b border-orange-200 pb-2.5 mb-3">
                      <div className="flex items-center gap-2">
                        <span className="text-orange-600 animate-bounce"><Icons.Bell /></span>
                        <h2 className="font-black text-orange-950 text-sm uppercase tracking-wider">Notice Board</h2>
                      </div>
                      
                      {/* BLINKING LIVE BUTTON */}
                      <span className="inline-flex items-center gap-1.5 bg-gradient-to-r from-orange-600 to-emerald-600 text-white font-extrabold text-[10px] px-2.5 py-0.5 rounded-full shadow-md tracking-wider">
                        <span className="w-2 h-2 rounded-full bg-white animate-ping"></span>
                        LIVE
                      </span>
                    </div>

                    <div className="space-y-2.5">
                      {notices.map((n) => (
                        <div key={n.id} className="flex items-start gap-2.5 text-xs font-semibold text-slate-800 bg-white/90 p-2.5 rounded-xl border border-orange-200/80 shadow-2xs">
                          <span className="text-orange-600 font-extrabold text-sm leading-none">•</span>
                          <span className="leading-relaxed">{n.text}</span>
                        </div>
                      ))}
                    </div>
                  </div>

                  <div className="space-y-3">
                    <div className="relative">
                      <div className="absolute left-3.5 top-3 text-slate-400"><Icons.Search /></div>
                      <input
                        type="text"
                        value={searchQuery}
                        onChange={(e) => setSearchQuery(e.target.value)}
                        placeholder="Search form, service..."
                        className="w-full bg-white border border-slate-300 rounded-xl pl-10 pr-4 py-2.5 text-xs sm:text-sm font-medium focus:outline-none focus:border-orange-500"
                      />
                    </div>

                    <div className="flex items-center gap-2 overflow-x-auto pb-1 scrollbar-none">
                      {categories.map((catObj) => {
                        const catName = typeof catObj === 'object' ? catObj.name : catObj;
                        const isSelected = selectedCat === catName;
                        return (
                          <button
                            key={catName}
                            onClick={() => handleCategorySelect(catName)}
                            style={getCategoryButtonStyle(catObj, isSelected)}
                            className="px-3.5 py-1.5 rounded-lg text-xs font-bold transition-all border shrink-0"
                          >
                            {catName}
                          </button>
                        );
                      })}
                    </div>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                    {filteredServices.map((srv) => (
                      <div 
                        key={srv.id} 
                        onClick={() => openServiceDetail(srv)} 
                        className="bg-white rounded-xl border border-slate-200 p-4 shadow-2xs hover:shadow-md hover:border-orange-400 transition-all cursor-pointer flex flex-col justify-between relative overflow-hidden group"
                      >
                        <div className="absolute top-0 left-0 right-0 h-1 bg-gradient-to-r from-orange-500 via-amber-300 to-emerald-500 opacity-80 group-hover:opacity-100 transition-opacity"></div>
                        <div>
                          <span className="post-category-badge bg-orange-100 text-orange-900 text-[10px] font-bold px-2 py-0.5 rounded border border-orange-200">
                            {srv.category}
                          </span>
                          <h4 className="font-bold text-slate-900 text-sm mt-2">{srv.title}</h4>
                          <p className="text-xs text-slate-500 mt-1 line-clamp-2">{srv.description}</p>
                        </div>

                        <div className="pt-4 border-t border-slate-100 flex items-center justify-between text-xs font-bold text-orange-600 mt-3 group-hover:text-emerald-700">
                          <span>Apply Now & Fill Details</span>
                          <Icons.ChevronRight />
                        </div>
                      </div>
                    ))}
                  </div>
                </main>
              )}

              {/* FOOTER WITH COMPLETE COMPLIANCE MODAL BUTTONS, TIMELINE & ADDRESS */}
              <footer className="bg-slate-950 text-slate-400 text-xs py-6 mt-12 border-t-4 border-orange-500 text-center px-4 relative">
                <p className="font-extrabold text-white">SGS ONLINE SERVICE © 2026 • Private Online Assistance Desk</p>
                <p className="text-[11px] text-slate-500 mt-1">📍 Registered Office: District Arrah, Bhojpur, Bihar, India - 802301 | Support: contactsgsonlineservice@gmail.com</p>
                <div className="flex flex-wrap items-center justify-center gap-4 text-xs mt-3">
                  <button onClick={() => { setActiveModalPage('about'); }} className="text-slate-400 hover:text-orange-400 underline">About Us</button>
                  <button onClick={() => { setActiveModalPage('support'); }} className="text-slate-400 hover:text-emerald-400 underline">Customer Support & Grievance</button>
                  <button onClick={() => { setActiveModalPage('delivery_policy'); }} className="text-slate-400 hover:text-orange-400 underline">Fulfillment Timeline</button>
                  <button onClick={() => { setActiveModalPage('privacy'); }} className="text-slate-400 hover:text-orange-400 underline">Privacy Policy</button>
                  <button onClick={() => { setActiveModalPage('payment_policy'); }} className="text-slate-400 hover:text-emerald-400 underline">Payment & Refund Policy</button>
                  <button onClick={() => { setActiveModalPage('terms'); }} className="text-slate-400 hover:text-emerald-400 underline">Terms & Conditions</button>
                  <button onClick={() => { setActiveModalPage('disclaimer'); }} className="text-slate-400 hover:text-orange-400 underline">Disclaimer</button>
                </div>
              </footer>
            </>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);

  </script>
</body>
</html>
