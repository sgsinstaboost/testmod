<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SGS ONLINE SERVICE - Government & College Online Seva Portal</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    html, body {
      overscroll-behavior-y: contain;
    }
    .scrollbar-none::-webkit-scrollbar {
      display: none;
    }
    .scrollbar-none {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    #splash-screen {
      transition: opacity 0.4s ease-out;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased selection:bg-yellow-200">
  
  <!-- Splash Screen -->
  <div id="splash-screen" class="fixed inset-0 z-[100] bg-gradient-to-br from-blue-900 via-indigo-900 to-slate-950 flex flex-col items-center justify-center p-4 text-white">
    <div class="flex flex-col items-center text-center max-w-sm">
      <div class="w-16 h-16 bg-yellow-400 text-slate-950 rounded-2xl flex items-center justify-center text-2xl font-black shadow-lg mb-4 animate-pulse">
        SGS
      </div>
      <h1 class="text-xl sm:text-2xl font-black text-yellow-300 tracking-tight leading-tight">
        SGS ONLINE SERVICE
      </h1>
      <p class="text-[11px] font-bold text-amber-200/90 uppercase tracking-widest mt-1">
        Government & College Online Seva Portal
      </p>

      <div class="mt-8 flex flex-col items-center gap-2">
        <div class="w-8 h-8 border-3 border-yellow-400 border-t-transparent rounded-full animate-spin"></div>
        <p class="text-[11px] text-slate-300 font-semibold tracking-wide">Loading Seva Portal...</p>
      </div>
    </div>
  </div>

  <div id="root"></div>

  <script>
    setTimeout(() => {
      const splash = document.getElementById('splash-screen');
      if (splash) {
        splash.style.opacity = '0';
        setTimeout(() => splash.remove(), 400);
      }
    }, 800);
  </script>

  <script type="text/babel">

    // SVG Icons

      ArrowLeft: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>,
      ExternalLink: () => <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/></svg>,
      CheckCircle2: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>,
      FileText: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>,
      X: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12"/></svg>,
      ChevronRight: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 5l7 7-7 7"/></svg>,
      Bell: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/></svg>,
      Menu: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 6h16M4 12h16M4 18h16"/></svg>,
      ShieldCheck: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/></svg>,
      Share2: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z"/></svg>
    };

    const SEED_NOTICES = [
      { id: 'n1', text: 'Bihar Graduation Admission Online Form 2026 Process Start.', date: '01 Aug 2026' },
      { id: 'n2', text: 'Post Matric Scholarship Last Date Extend Ho Chuki Hai.', date: '30 Jul 2026' }
    ];

    const SEED_CATEGORIES = [
      'Sabhi Services',
      'College Admission',
      'Scholarship',
      'Certificates (Jati/Aaya/Niwas)',
      'Admit Card & Result'
    ];

    // =========================================================================
    // 🚀 SABHI USERS KO DIKHNE WALI SERVICES KI LIST (EDIT YAHAN KAREIN)
    // Nayi service add karne ke liye niche ka ek block copy-paste karein.
    // =========================================================================
    const SEED_SERVICES = [

      // --- SERVICE 1 ---
      {
        id: 's-1',
        category: 'College Admission',
        title: 'VKSU Part 1 Admission Form 2026',
        shortDesc: 'Veer Kunwar Singh University BA / B.Sc / B.Com Online Admission Form',
        description: 'VKSU Me Graduation Admission Ke Liye Online Application Form Bharein.',
        requiredDocs: ['10th & 12th Marksheet', 'Identity Card Proof', 'Passport Photo', 'Email & Mobile Number'],
        applyLink: 'https://example.com/apply-vksu-admission'
      },

      // --- SERVICE 2 ---
      {
        id: 's-2',
        category: 'College Admission',
        title: 'Patliputra University Graduation Form',
        shortDesc: 'PPU UG Regular Admission Online Application Portal',
        description: 'Patliputra University Me BA / B.Sc / B.Com Course Ke Liye Apply Karein.',
        requiredDocs: ['12th Marksheet', 'TC / CLC Certificate', 'Identity Card Proof', 'Photo'],
        applyLink: 'https://example.com/apply-ppu-ug'
      },

      // --- SERVICE 3 ---
      {
        id: 's-3',
        category: 'Scholarship',
        title: 'Bihar Post Matric Scholarship (PMS)',
        shortDesc: 'SC, ST, BC, EBC Chhatravriti Yojana Online Form',
        description: 'Post Matric Scholarship Scheme Active. Apne Documents Ke Saath Apply Karein.',
        requiredDocs: ['Identity Card Proof', 'Caste Certificate', 'Income Certificate', 'Fee Receipt', 'Bank Passbook'],
        applyLink: 'https://example.com/apply-pms-scholarship'
      },

      // --- SERVICE 4 ---
      {
        id: 's-4',
        category: 'Scholarship',
        title: 'National Scholarship Portal (NSP) 2026',
        shortDesc: 'NSP Pre & Post Matric Central Scholarship Application',
        description: 'National Scholarship Portal All India Schemes Apply Online.',
        requiredDocs: ['Bonafide Certificate', 'Marksheet', 'Income Proof', 'Identity Card Proof'],
        applyLink: 'https://example.com/apply-nsp'
      },

      // --- SERVICE 5 ---
      {
        id: 's-5',
        category: 'Certificates (Jati/Aaya/Niwas)',
        title: 'Jati Parman Patra (Caste Certificate)',
        shortDesc: 'Bihar RTPS Online Caste Certificate Apply Portal',
        description: 'Ghar Baite Jati Parman Patra Online Apply Karein.',
        requiredDocs: ['Identity Card Proof', 'Photo', 'Swayam Goshna Patra'],
        applyLink: 'https://example.com/apply-caste-certificate'
      },

      // --- SERVICE 6 ---
      {
        id: 's-6',
        category: 'Certificates (Jati/Aaya/Niwas)',
        title: 'Aaya Parman Patra (Income Certificate)',
        shortDesc: 'Bihar RTPS Income Certificate Apply',
        description: 'Naye Aaya Parman Patra Ke Liye Online Aavedan Karein.',
        requiredDocs: ['Identity Card Proof', 'Ration Card / Revenue Details', 'Photo'],
        applyLink: 'https://example.com/apply-income-certificate'
      },

      // --- SERVICE 7 ---
      {
        id: 's-7',
        category: 'Certificates (Jati/Aaya/Niwas)',
        title: 'Niwas Parman Patra (Residence Certificate)',
        shortDesc: 'Residence Certificate (Residential Proof) Online Portal',
        description: 'Bihar Niwas Certificate Online Banalwane Ke Liye Click Karein.',
        requiredDocs: ['Identity Card Proof', 'Mobile Number', 'Passport Photo'],
        applyLink: 'https://example.com/apply-residence-certificate'
      },

      // --- SERVICE 8 ---
      {
        id: 's-8',
        category: 'Certificates (Jati/Aaya/Niwas)',
        title: 'EWS Certificate Online Apply',
        shortDesc: 'Economically Weaker Section (EWS) Certificate',
        description: 'General Category EWS Reservation Certificate Apply Karein.',
        requiredDocs: ['Income Proof', 'Khatiyan / Land Proof', 'Identity Card Proof', 'Photo'],
        applyLink: 'https://example.com/apply-ews'
      },

      // --- SERVICE 9 ---
      {
        id: 's-9',
        category: 'Admit Card & Result',
        title: 'College Admit Card Download Portal',
        shortDesc: 'University Exam Admit Card Direct Download Link',
        description: 'Apna Registration Number Daal Kar Admit Card Download Karein.',
        requiredDocs: ['Registration Number', 'Date of Birth'],
        applyLink: 'https://example.com/download-admit-card'
      },

      // --- SERVICE 10 ---
      {
        id: 's-10',
        category: 'Admit Card & Result',
        title: 'Semester & Annual Exam Result Check',
        shortDesc: 'Check All Board / University Examination Results',
        description: 'Exam Roll Number Aur Roll Code Se Marks Check Karein.',
        requiredDocs: ['Roll Code', 'Roll Number'],
        applyLink: 'https://example.com/check-exam-result'
      }

      /* 
      // 💡 Nayi service add karne ke liye yahan comma (,) laga kar niche wala block paste karein:
      ,{
        id: 's-11',
        category: 'College Admission',
        title: 'Aapki Nayi Service Ka Naam',
        shortDesc: 'Chota description',
        description: 'Poori details yahan likhein.',
        requiredDocs: ['Aadhaar Card', 'Photo', '10th Marksheet'],
        applyLink: 'https://aapki-link-yahan.com'
      }
      */
    ];

    function App() {
      const [services] = useState(SEED_SERVICES);
      const [notices] = useState(SEED_NOTICES);
      const [categories] = useState(SEED_CATEGORIES);

      const [selectedCat, setSelectedCat] = useState('Sabhi Services');
      const [searchQuery, setSearchQuery] = useState('');
      const [activeService, setActiveService] = useState(null); 

      // Navigation & Modal Views
      const [showDrawer, setShowDrawer] = useState(false);
      const [activeModalPage, setActiveModalPage] = useState(null);

      const [toastMsg, setToastMsg] = useState('');

      const showNotification = (msg) => {
        setToastMsg(msg);
        setTimeout(() => setToastMsg(''), 3000);
      };

      useEffect(() => {
        const handlePopState = () => {
          if (activeService) {
            setActiveService(null);
          } else if (activeModalPage) {
            setActiveModalPage(null);
          } else if (showDrawer) {
            setShowDrawer(false);
          }
        };
        window.addEventListener('popstate', handlePopState);
        return () => window.removeEventListener('popstate', handlePopState);
      }, [activeService, activeModalPage, showDrawer]);

      const openServiceDetail = (srv) => {
        window.history.pushState({ view: 'detail' }, '');
        setActiveService(srv);
      };

      const openApplyLink = (srv) => {
        if (srv && srv.applyLink) {
          window.open(srv.applyLink, '_blank', 'noopener,noreferrer');
          showNotification('Aapko official portal par redirect kiya ja raha hai...');
        } else {
          showNotification('Apply link uplabdh nahi hai!');
        }
      };

      const handleBackToServices = () => {
        if (window.history.state?.view) {
          window.history.back();
        } else {
          setActiveService(null);
        }
      };

      const handleShareWebsite = () => {
        const shareData = {
          title: 'SGS ONLINE SERVICE',
          text: 'SGS ONLINE SERVICE - Government & College Online Form Seva Portal',
          url: window.location.href
        };

        if (navigator.share) {
          navigator.share(shareData).catch(() => {});
        } else {
          const tempInput = document.createElement('input');
          tempInput.value = window.location.href;
          document.body.appendChild(tempInput);
          tempInput.select();
          document.execCommand('copy');
          document.body.removeChild(tempInput);
          showNotification('Website link copy ho gaya hai!');
        }
        setShowDrawer(false);
      };

      const filteredServices = services.filter(s => {
        const matchCat = selectedCat === 'Sabhi Services' || s.category === selectedCat;
        const matchSearch = s.title.toLowerCase().includes(searchQuery.toLowerCase()) || 
                            s.shortDesc?.toLowerCase().includes(searchQuery.toLowerCase());
        return matchCat && matchSearch;
      });

      return (
        <div className="min-h-screen bg-slate-50 font-sans text-slate-800 flex flex-col relative">
          
          {/* Toast Notification */}
          {toastMsg && (
            <div className="fixed top-3 right-3 z-50 bg-slate-900 text-yellow-300 font-bold text-xs px-4 py-2.5 rounded-xl shadow-xl border border-yellow-400/30 animate-bounce">
              ⚡ {toastMsg}
            </div>
          )}

          {/* STICKY HEADER */}
          <header className="sticky top-0 z-40 bg-gradient-to-r from-blue-700 via-indigo-700 to-purple-800 text-white shadow-sm border-b border-indigo-500/30 py-2 px-3">
            <div className="max-w-6xl mx-auto flex items-center justify-between gap-2">
              
              <button 
                onClick={() => setShowDrawer(true)}
                className="p-1.5 text-white hover:bg-white/10 rounded-lg transition-colors focus:outline-none flex items-center gap-1"
                title="Open Menu Drawer"
              >
                <Icons.Menu />
              </button>

              <div 
                onClick={() => {
                  setActiveService(null);
                  setSelectedCat('Sabhi Services');
                  setSearchQuery('');
                }}
                className="cursor-pointer text-center group flex-1"
              >
                <h1 className="text-base sm:text-xl font-extrabold tracking-tight text-yellow-300 group-hover:text-yellow-200 transition-colors leading-tight">
                  SGS ONLINE SERVICE
                </h1>
                <p className="text-[9px] sm:text-[11px] font-bold text-amber-200/90 uppercase tracking-wider leading-none mt-0.5">
                  Government & College Online Form Seva Portal
                </p>
              </div>

            </div>
          </header>

          {/* SIDE DRAWER MENU */}
          {showDrawer && (
            <div className="fixed inset-0 z-50 flex">
              <div 
                className="fixed inset-0 bg-slate-900/60 backdrop-blur-xs transition-opacity"
                onClick={() => setShowDrawer(false)}
              ></div>

              <div className="relative w-72 max-w-[80%] bg-white h-full shadow-2xl flex flex-col justify-between z-10 p-5 overflow-y-auto">
                <div>
                  <div className="flex items-center justify-between pb-4 border-b border-slate-200 mb-4">
                    <div>
                      <h3 className="font-extrabold text-blue-800 text-base">SGS ONLINE SERVICE</h3>
                      <p className="text-[10px] text-slate-500 font-semibold">Authorized Cyber Seva Kendra</p>
                    </div>
                    <button onClick={() => setShowDrawer(false)} className="text-slate-400 hover:text-slate-600 p-1">
                      <Icons.X />
                    </button>
                  </div>

                  <nav className="space-y-2 text-xs font-bold text-slate-700">
                    <button
                      onClick={() => { 
                        setSelectedCat('Sabhi Services'); 
                        setActiveService(null); 
                        setShowDrawer(false); 
                      }}
                      className="w-full text-left p-2.5 rounded-lg hover:bg-slate-100 flex items-center justify-between text-blue-700"
                    >
                      <span>🏠 Home Page / Sabhi Services</span>
                      <Icons.ChevronRight />
                    </button>

                    <button
                      onClick={handleShareWebsite}
                      className="w-full text-left p-2.5 rounded-lg bg-emerald-50 hover:bg-emerald-100 text-emerald-800 flex items-center justify-between border border-emerald-200 mt-1"
                    >
                      <span className="flex items-center gap-1.5 font-extrabold">
                        <Icons.Share2 />
                        <span>Share Website</span>
                      </span>
                      <Icons.ChevronRight />
                    </button>

                    <button
                      onClick={() => { setActiveModalPage('privacy'); setShowDrawer(false); }}
                      className="w-full text-left p-2.5 rounded-lg hover:bg-slate-100 flex items-center justify-between text-slate-800"
                    >
                      <span>🔒 Privacy Policy</span>
                      <Icons.ChevronRight />
                    </button>

                    <button
                      onClick={() => { setActiveModalPage('terms'); setShowDrawer(false); }}
                      className="w-full text-left p-2.5 rounded-lg hover:bg-slate-100 flex items-center justify-between text-slate-800"
                    >
                      <span>📜 Terms & Conditions</span>
                      <Icons.ChevronRight />
                    </button>
                  </nav>
                </div>

                <div className="pt-4 border-t border-slate-200 space-y-2">
                  <p className="text-[10px] text-slate-400 text-center">
                    SGS Online Portal • Safe & Fast Direct Service Links
                  </p>
                </div>
              </div>
            </div>
          )}

          {/* POLICY & TERMS MODALS */}
          {activeModalPage && (
            <div className="fixed inset-0 bg-slate-900/60 z-50 flex items-center justify-center p-4 overflow-y-auto">
              <div className="bg-white rounded-xl max-w-lg w-full p-6 shadow-2xl my-8 border border-slate-200 max-h-[90vh] flex flex-col">
                <div className="flex items-center justify-between border-b pb-3 mb-4">
                  <h3 className="font-extrabold text-slate-900 text-base flex items-center gap-2">
                    {activeModalPage === 'privacy' && <span>🔒 Privacy Policy</span>}
                    {activeModalPage === 'terms' && <span>📜 Terms & Conditions</span>}
                  </h3>
                  <button onClick={() => setActiveModalPage(null)} className="text-slate-400 hover:text-slate-600">
                    <Icons.X />
                  </button>
                </div>

                <div className="flex-1 overflow-y-auto text-xs text-slate-700 space-y-4 pr-1">
                  {activeModalPage === 'privacy' && (
                    <div className="space-y-3 leading-relaxed">
                      <p>SGS ONLINE SERVICE customer ke dwaara di gayi sabhi details ko confidential rakhta hai. Hum aapke details ka upyog kewal official portals par forms submit karne ke liye karte hain.</p>
                    </div>
                  )}

                  {activeModalPage === 'terms' && (
                    <div className="space-y-3 leading-relaxed">
                      <p>SGS ONLINE SERVICE ek facilitation portal hai. Final form approval official department dwaara kiya jata hai.</p>
                    </div>
                  )}
                </div>

                <div className="pt-3 border-t mt-4 flex justify-end">
                  <button onClick={() => setActiveModalPage(null)} className="bg-slate-800 text-white font-bold px-4 py-2 rounded-lg text-xs">
                    Close
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* MAIN CONTENT AREA */}
          {activeService ? (
            /* SERVICE DETAIL VIEW */
            <main className="flex-1 max-w-4xl w-full mx-auto px-4 py-6">
              <button
                onClick={handleBackToServices}
                className="inline-flex items-center gap-2 bg-white hover:bg-slate-200 text-slate-800 font-bold text-xs sm:text-sm px-4 py-2 rounded-xl border border-slate-300 shadow-2xs mb-6 transition-all"
              >
                <Icons.ArrowLeft /> Sabhi Services Par Wapas Jayein
              </button>

              <div className="bg-white rounded-xl shadow-md border border-slate-200 overflow-hidden">
                <div className="bg-slate-900 text-white p-6 sm:p-8">
                  <span className="bg-blue-600 text-white text-[11px] font-bold px-2.5 py-1 rounded uppercase tracking-wider">
                    {activeService.category}
                  </span>
                  <h2 className="text-2xl sm:text-3xl font-extrabold text-white mt-3 leading-snug">
                    {activeService.title}
                  </h2>
                </div>

                <div className="p-6 sm:p-8 space-y-6">
                  {activeService.requiredDocs && activeService.requiredDocs.length > 0 && (
                    <div className="bg-slate-50 border border-slate-200 rounded-xl p-5">
                      <h3 className="text-base font-bold text-slate-900 flex items-center gap-2 mb-3">
                        <Icons.FileText />
                        <span>Kya-Kya Dastavez (Documents) Lagega:</span>
                      </h3>
                      <ul className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                        {activeService.requiredDocs.map((doc, idx) => (
                          <li key={idx} className="flex items-start gap-2 text-xs sm:text-sm text-slate-700 bg-white p-2.5 rounded border border-slate-200">
                            <span className="text-emerald-600"><Icons.CheckCircle2 /></span>
                            <span>{doc}</span>
                          </li>
                        ))}
                      </ul>
                    </div>
                  )}

                  <div>
                    <h3 className="text-base font-bold text-slate-900 mb-2 border-b border-slate-200 pb-2">
                      Poori Jaankari / Description:
                    </h3>
                    <div className="whitespace-pre-line text-sm text-slate-700 leading-relaxed bg-slate-50/50 p-4 rounded-lg border border-slate-200">
                      {activeService.description || "Apply Button par click karke form bharein."}
                    </div>
                  </div>

                  <div className="pt-6 border-t border-slate-200 text-center">
                    <button
                      onClick={() => openApplyLink(activeService)}
                      className="w-full sm:w-auto min-w-[260px] bg-blue-700 hover:bg-blue-800 text-white font-extrabold text-lg px-8 py-3.5 rounded-xl shadow-lg transition-all flex items-center justify-center gap-2 mx-auto"
                    >
                      <span>ONLINE APPLY KAREIN</span>
                      <Icons.ExternalLink />
                    </button>
                  </div>
                </div>
              </div>
            </main>
          ) : 

          /* HOME LIST VIEW */
          (
            <main className="flex-1 max-w-6xl w-full mx-auto px-4 py-6 space-y-6">
              
              {/* NOTICE BOARD */}
              <div className="bg-white border border-slate-300 rounded-xl p-4 shadow-2xs">
                <div className="flex items-center justify-between border-b border-slate-200 pb-2 mb-3">
                  <div className="flex items-center gap-2">
                    <span className="text-blue-700"><Icons.Bell /></span>
                    <h2 className="font-extrabold text-slate-900 text-sm sm:text-base uppercase tracking-wider">
                      Notice Board / Taaza Updates
                    </h2>
                  </div>
                </div>

                <div className="space-y-2">
                  {notices.map((n) => (
                    <div key={n.id} className="flex items-start justify-between gap-3 p-2 rounded hover:bg-slate-50 transition-colors border-b border-slate-100 last:border-0">
                      <div className="flex items-start gap-2 text-xs sm:text-sm font-medium text-slate-800">
                        <span className="text-blue-600 font-bold shrink-0 mt-0.5">•</span>
                        <span>{n.text}</span>
                      </div>
                      {n.date && <span className="text-[11px] text-slate-400 font-normal shrink-0">{n.date}</span>}
                    </div>
                  ))}
                </div>
              </div>

              {/* SEARCH & CATEGORY FILTER TABS */}
              <div className="space-y-3">
                <div className="relative">
                  <div className="absolute left-3.5 top-3 text-slate-400"><Icons.Search /></div>
                  <input
                    type="text"
                    value={searchQuery}
                    onChange={(e) => setSearchQuery(e.target.value)}
                    placeholder="College Admission, Jati, Scholarship Form search karein..."
                    className="w-full bg-white border border-slate-300 rounded-xl pl-10 pr-4 py-2.5 text-xs sm:text-sm font-medium focus:outline-none focus:border-blue-600 shadow-2xs"
                  />
                </div>

                {/* CATEGORY BUTTONS */}
                <div className="flex items-center gap-2 overflow-x-auto pb-1 scrollbar-none">
                  {categories.map((cat) => (
                    <button
                      key={cat}
                      onClick={() => setSelectedCat(cat)}
                      className={`px-3.5 py-1.5 rounded-lg text-xs font-bold transition-all border shrink-0 ${
                        selectedCat === cat
                          ? 'bg-blue-700 text-white border-blue-700 shadow-xs'
                          : 'bg-white text-slate-700 border-slate-300 hover:bg-slate-100'
                      }`}
                    >
                      {cat}
                    </button>
                  ))}
                </div>
              </div>

              {/* SERVICE CARDS GRID */}
              <div className="space-y-3">
                <div className="flex items-center justify-between">
                  <h3 className="font-extrabold text-slate-900 text-sm sm:text-base">
                    {selectedCat} ({filteredServices.length})
                  </h3>
                </div>

                {filteredServices.length === 0 ? (
                  <div className="bg-white p-8 rounded-xl border border-slate-200 text-center space-y-3">
                    <p className="text-slate-500 font-bold text-sm">Is category me abhi koi service nahi mili!</p>
                  </div>
                ) : (
                  <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                    {filteredServices.map((srv) => (
                      <div
                        key={srv.id}
                        onClick={() => openServiceDetail(srv)}
                        className="bg-white rounded-xl border border-slate-300 shadow-2xs hover:shadow-md transition-all cursor-pointer flex flex-col justify-between group overflow-hidden relative"
                      >
                        <div className="p-4">
                          <div className="flex items-center justify-between mb-2">
                            <span className="bg-slate-100 text-slate-700 text-[10px] font-bold px-2 py-0.5 rounded border border-slate-200">
                              {srv.category}
                            </span>
                          </div>

                          <h4 className="font-bold text-slate-900 text-sm group-hover:text-blue-700 leading-snug">
                            {srv.title}
                          </h4>

                          {srv.shortDesc && (
                            <p className="text-xs text-slate-500 mt-1.5 line-clamp-2">
                              {srv.shortDesc}
                            </p>
                          )}
                        </div>

                        <div className="p-4 pt-2 border-t border-slate-100 flex items-center justify-between text-xs font-bold text-blue-700 bg-slate-50/50">
                          <span>Full Detail & Apply</span>
                          <span className="group-hover:translate-x-1 transition-transform"><Icons.ChevronRight /></span>
                        </div>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            </main>
          )}

          {/* FOOTER */}
          <footer className="bg-slate-900 text-slate-400 text-xs py-6 mt-12 border-t border-slate-800">
            <div className="max-w-6xl mx-auto px-4 flex flex-col sm:flex-row items-center justify-between gap-3 text-center sm:text-left">
              <div>
                <p className="font-bold text-white">SGS ONLINE SERVICE © 2026</p>
                <p className="text-slate-500 text-[11px] mt-0.5">All Governmental & College Online Works Portal</p>
              </div>

              <div className="flex items-center gap-4 text-xs">
                <button
                  onClick={() => setActiveModalPage('privacy')}
                  className="text-slate-400 hover:text-white underline underline-offset-2"
                >
                  Privacy Policy
                </button>

                <button
                  onClick={() => setActiveModalPage('terms')}
                  className="text-slate-400 hover:text-white underline underline-offset-2"
                >
                  Terms & Conditions
                </button>
              </div>
            </div>
          </footer>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
